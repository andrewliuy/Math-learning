<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Math Quest</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090e20;
      --panel: #131d36;
      --line: #344466;
      --text: #f4f6ff;
      --muted: #b7c5e2;
      --mint: #86ffd5;
      --gold: #ffd884;
      --pink: #ffabbc;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      min-height: 100vh;
      font: 1rem/1.55 system-ui, sans-serif;
      color: var(--text);
      background: radial-gradient(ellipse at 80% 0%, #292351, transparent 38rem), var(--bg);
    }

    header, main {
      width: min(1120px, calc(100% - 32px));
      margin: auto;
    }

    header {
      padding: 16px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    main { padding-bottom: 56px; }
    h1, h2, h3, p { margin: 0 0 .65em; }
    h1 { font-size: clamp(2.6rem, 9vw, 6.3rem); line-height: .95; letter-spacing: -.075em; }
    h2 { font-size: clamp(1.55rem, 4vw, 2.5rem); line-height: 1.12; }
    h3 { line-height: 1.25; }
    p, li { color: var(--muted); }
    strong { color: var(--text); }
    .brand { font-weight: 900; letter-spacing: .04em; color: var(--mint); }
    .xp { color: var(--gold); font-weight: 800; }
    .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    .eyebrow { color: var(--mint); font-size: .8rem; font-weight: 850; letter-spacing: .12em; text-transform: uppercase; }

    button {
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 9px 16px;
      background: #202e50;
      color: var(--text);
      font: inherit;
      font-weight: 740;
      cursor: pointer;
    }

    button:hover:not(:disabled) { border-color: var(--mint); background: #2c416c; }
    button.primary { background: var(--mint); border-color: var(--mint); color: #09231d; }
    button.primary:hover:not(:disabled) { background: #b9ffe7; }
    button:disabled { opacity: .6; cursor: default; }
    :focus-visible { outline: 3px solid var(--gold); outline-offset: 4px; }

    .hero {
      position: relative;
      isolation: isolate;
      min-height: 380px;
      overflow: hidden;
      display: grid;
      align-items: center;
      padding: clamp(22px, 6vw, 64px);
      border: 1px solid #52628e;
      border-radius: 26px;
      background: #19284a;
    }

    #sky { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -2; }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: linear-gradient(90deg, #0b1227 3%, #0b1227dc 39%, #0b122730 77%);
    }

    .hero p:not(.eyebrow) { max-width: 33ch; margin: 14px 0 20px; }
    .section-title { margin-top: 28px; }

    .worlds {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 255px), 1fr));
      gap: 14px;
    }

    .world, .panel, .note {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: clamp(16px, 4vw, 32px);
    }

    .world { padding: 18px; }
    .panel { margin-top: 14px; }
    .note { padding: 16px; margin: 14px 0; background: #1b2947; }
    .world-head { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
    .world-head h3 { margin: 0; }

    .sigil {
      display: grid;
      place-items: center;
      flex: 0 0 52px;
      height: 52px;
      border: 1px solid currentColor;
      border-radius: 15px;
      color: var(--world);
      font-size: 1.6rem;
      font-weight: 800;
    }

    details { border-top: 1px solid var(--line); padding: 10px 0; }
    details p { margin: 7px 0; }
    summary { cursor: pointer; font-weight: 700; }
    .chapter { margin-top: 8px; }
    .answers { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 18px 0; }
    .answers button { text-align: left; overflow-wrap: anywhere; }
    .answers button[aria-pressed="true"] { border-color: var(--mint); box-shadow: inset 0 0 0 1px var(--mint); }
    progress { display: block; width: 100%; height: 12px; margin: 8px 0 20px; accent-color: var(--mint); }
    .good { color: var(--mint); }
    .bad { color: var(--pink); }
    #notice:empty { display: none; }

    @media (max-width: 520px) {
      .answers { grid-template-columns: 1fr; }
      .hero { min-height: 340px; }
      .hero::after { background: linear-gradient(90deg, #0b1227ed, #0b122787); }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">✦ MATH QUEST</div>
    <nav class="actions" aria-label="Game navigation">
      <button id="mapButton">World map</button>
      <button id="journalButton">Quest journal</button>
      <span class="xp" id="xp"></span>
    </nav>
  </header>

  <main>
    <p id="notice" role="status"></p>

    <section id="map">
      <div class="hero">
        <canvas id="sky" aria-hidden="true"></canvas>
        <div>
          <p class="eyebrow">The academy world map</p>
          <h1>Math Quest</h1>
          <p>Explore the curriculum. Train in three realms. Clear chapter checkpoints to unlock your next quest.</p>
          <button id="questButton" class="primary"></button>
        </div>
      </div>
      <h2 class="section-title">Explore the curriculum</h2>
      <p>Open any chapter to see what you’ll learn and try reading its worked example.</p>
      <div id="worlds" class="worlds"></div>
    </section>

    <section id="screen" class="panel" hidden></section>
  </main>

  <script>
    "use strict";

    // Each chapter has a lesson, a worked example, and several problem families.
    // Problem families generate fresh values for placement, practice, and checkpoints.
    const realms = [
      {
        name: "Number Forge", subject: "Arithmetic", icon: "×", color: "#ffcf85",
        chapters: [
          {
            title: "Whole Numbers",
            goal: "Use place value and the distributive property to calculate efficiently.",
            example: "37 × 6 = (30 + 7) × 6 = 180 + 42 = 222.",
            problems: [
              () => {
                const a = random(42, 98), b = random(12, 35);
                return problem(`What is ${a} − ${b}?`, a - b, [a + b, a - b + 10, a - b - 4],
                  "Subtract the tens first, then subtract the ones.",
                  `${a} − ${Math.floor(b / 10) * 10} = ${a - Math.floor(b / 10) * 10}. Subtract the remaining ${b % 10} to get ${a - b}.`);
              },
              () => {
                const a = random(13, 39), b = random(3, 9);
                const tens = a - a % 10, ones = a % 10;
                return problem(`What is ${a} × ${b}?`, a * b, [a * b + b, a * b - b, a * b + 10],
                  "Split the first number into tens and ones.",
                  `(${tens} + ${ones}) × ${b} = ${tens * b} + ${ones * b} = ${a * b}.`);
              }
            ]
          },
          {
            title: "Fractions & Percents",
            goal: "Find a fractional or percentage part of a whole.",
            example: "35% of 80 = 30% of 80 + 5% of 80 = 24 + 4 = 28.",
            problems: [
              () => {
                const denominator = random(4, 9), part = random(3, 12);
                const total = denominator * part;
                return problem(`What is 3/${denominator} of ${total}?`, 3 * part, [part, 2 * part, 4 * part],
                  "Find one equal part first.",
                  `${total} ÷ ${denominator} = ${part}. Three parts make ${3 * part}.`);
              },
              () => {
                const percent = random(2, 9) * 5, total = random(3, 15) * 20;
                const answer = total * percent / 100;
                return problem(`What is ${percent}% of ${total}?`, answer, [answer + 5, answer * 2, total - answer],
                  "Write the percent as a fraction with a denominator of 100.",
                  `${total} × ${percent}/100 = ${answer}.`);
              }
            ]
          },
          {
            title: "Reverse Percent Problems",
            goal: "Recover a starting amount from a final amount after a percent change.",
            example: "After a 20% discount, $56 is 80% of the original price. Divide $56 by 0.80 to get $70.",
            problems: [
              () => {
                const rate = [20, 25, 40][random(0, 2)], original = 20 * random(4, 22);
                const sale = original * (100 - rate) / 100;
                return problem(`After a ${rate}% discount, an item costs $${sale}. What was its price before the discount?`, original,
                  [sale, original + 20, original - 10],
                  "Figure out what percent of the original price you paid.",
                  `$${sale} is ${100 - rate}% of the original price. Divide by ${(100 - rate) / 100} to get $${original}.`);
              },
              () => {
                const rate = [10, 25, 50][random(0, 2)], original = 20 * random(4, 22);
                const final = original * (100 + rate) / 100;
                return problem(`A population grew by ${rate}% to ${final}. What was the starting population?`, original,
                  [final, original - 10, original + 5],
                  "The new population represents more than 100% of the original.",
                  `${final} is ${100 + rate}% of the starting population. Divide by ${(100 + rate) / 100} to get ${original}.`);
              }
            ]
          }
        ]
      },
      {
        name: "Counting Forest", subject: "Counting", icon: "✦", color: "#86ffd5",
        chapters: [
          {
            title: "The Multiplication Principle",
            goal: "Count outcomes by multiplying the number of choices at each step.",
            example: "With 4 shirts and 3 pairs of pants, each shirt makes 3 outfits. That gives 4 × 3 = 12 outfits.",
            problems: [
              () => {
                const a = random(3, 9), b = random(4, 10);
                return problem(`Choose one of ${a} shirts and one of ${b} pairs of pants. How many outfits can you make?`, a * b,
                  [a + b, a * b - a, a * b + 1],
                  "How many pairs of pants can go with each shirt?",
                  `Each of the ${a} shirts has ${b} matches, so there are ${a} × ${b} = ${a * b} outfits.`);
              },
              () => {
                const a = random(2, 6), b = random(3, 7), c = random(2, 5);
                return problem(`A lunch includes one of ${a} sandwiches, one of ${b} sides, and one of ${c} drinks. How many lunches are possible?`, a * b * c,
                  [a + b + c, a * b, a * b * c + c],
                  "Include the number of choices for all three parts.",
                  `${a} × ${b} × ${c} = ${a * b * c}.`);
              }
            ]
          },
          {
            title: "Order Matters",
            goal: "Distinguish ordered selections from groups whose order does not matter.",
            example: "5 students can fill two different roles in 5 × 4 = 20 ways. For a two-person team, divide by 2 to get 10.",
            problems: [
              () => {
                const n = random(5, 16), ordered = n * (n - 1);
                return problem(`How many different two-person teams can you choose from ${n} students?`, ordered / 2,
                  [ordered, ordered / 2 + 1, n],
                  "A team appears twice when you list members in order.",
                  `There are ${n} × ${n - 1} = ${ordered} ordered pairs. Divide by 2 to get ${ordered / 2} teams.`);
              },
              () => {
                const n = random(5, 16), answer = n * (n - 1);
                return problem(`How many ways can ${n} students fill the roles of captain and deputy, with different people in the roles?`, answer,
                  [answer / 2, n * n, answer - 1],
                  "The two roles are different, and the captain cannot also be deputy.",
                  `There are ${n} choices for captain and ${n - 1} choices for deputy. Multiply to get ${answer}.`);
              }
            ]
          },
          {
            title: "Count the Complement",
            goal: "Count a wanted set by subtracting unwanted outcomes from all outcomes.",
            example: "Four coin flips produce 2⁴ = 16 sequences. Only TTTT has zero heads. So 15 sequences have at least one head.",
            problems: [
              () => {
                const n = random(4, 9), total = 2 ** n;
                return problem(`A coin is flipped ${n} times. How many ordered sequences contain at least one head?`, total - 1,
                  [total, total / 2, total - 2],
                  "How many sequences contain zero heads?",
                  `There are 2^${n} = ${total} sequences. Subtract the single all-tails sequence to get ${total - 1}.`);
              },
              () => {
                const n = random(2, 5), sides = random(3, 7);
                const total = sides ** n, none = (sides - 1) ** n;
                return problem(`Each of ${n} slots can contain any digit from 1 through ${sides}. How many codes contain at least one 1?`, total - none,
                  [total, none, total - 1],
                  `There are ${sides - 1} choices per slot if you forbid the digit 1.`,
                  `All codes: ${sides}^${n} = ${total}. Codes with no 1: ${sides - 1}^${n} = ${none}. Subtract to get ${total - none}.`);
              }
            ]
          }
        ]
      },
      {
        name: "Geometry Citadel", subject: "Geometry", icon: "△", color: "#c9acff",
        chapters: [
          {
            title: "Area & Perimeter",
            goal: "Find the distance around a figure and the space it covers.",
            example: "A triangle with base 12 and perpendicular height 5 has area 12 × 5 ÷ 2 = 30 square units.",
            problems: [
              () => {
                const a = random(8, 26), b = random(3, 7), answer = 2 * (a + b);
                return problem(`Find the perimeter of a rectangle with length ${a} and width ${b}.`, answer,
                  [a + b, a * b, answer + 4],
                  "Add the lengths of all four sides.",
                  `${a} + ${b} + ${a} + ${b} = ${answer} units.`);
              },
              () => {
                const base = random(8, 26), height = 2 * random(3, 9), answer = base * height / 2;
                return problem(`A triangle has base ${base} and perpendicular height ${height}. Find its area.`, answer,
                  [base * height, base + height, answer + 2],
                  "A triangle has half the area of a parallelogram with the same base and height.",
                  `${base} × ${height} ÷ 2 = ${answer} square units.`);
              }
            ]
          },
          {
            title: "Right Triangles",
            goal: "Use the Pythagorean theorem to find a missing leg or hypotenuse.",
            example: "If the hypotenuse is 13 and one leg is 5, the other leg is √(13² − 5²) = √144 = 12.",
            problems: [
              () => {
                const scale = random(2, 12), a = 3 * scale, b = 4 * scale, c = 5 * scale;
                return problem(`A right triangle has legs ${a} and ${b}. Find its hypotenuse.`, c,
                  [a + b, b, c + 1],
                  "Add the squared legs, then take the square root.",
                  `√(${a}² + ${b}²) = √${c ** 2} = ${c}.`);
              },
              () => {
                const scale = random(2, 10), a = 5 * scale, b = 12 * scale, c = 13 * scale;
                return problem(`A right triangle has hypotenuse ${c} and one leg ${a}. Find the other leg.`, b,
                  [c - a, c, a + c],
                  "Subtract the square of the given leg from the hypotenuse squared.",
                  `√(${c}² − ${a}²) = √${b ** 2} = ${b}.`);
              }
            ]
          },
          {
            title: "Circles on the Coordinate Plane",
            goal: "Read the center and radius from a circle equation, then use πr² to find area.",
            example: "The sliding 6-foot ladder gives (x − 3√2)² + (y + 3√2)² = 36. The full graph has radius 6 and area 36π. The physical ladder motion traces an arc.",
            problems: [
              () => {
                const h = random(1, 12), k = random(1, 12), r = random(3, 12);
                return problem(`What is the center of (x − ${h})² + (y + ${k})² = ${r ** 2}?`, `(${h}, −${k})`,
                  [`(−${h}, ${k})`, `(${h}, ${k})`, `(−${h}, −${k})`],
                  "What x and y values make both parentheses zero?",
                  `x − ${h} = 0 gives x = ${h}. y + ${k} = 0 gives y = −${k}.`);
              },
              () => {
                const h = random(1, 12), k = random(1, 12), r = random(3, 12);
                return problem(`What area is enclosed by (x − ${h})² + (y + ${k})² = ${r ** 2}?`, `${r ** 2}π`,
                  [`${r}π`, `${2 * r}π`, `${r ** 4}π`],
                  "The right side equals r². The area formula is πr².",
                  `The radius is ${r}. Multiply ${r}² by π to get ${r ** 2}π square units.`);
              }
            ]
          }
        ]
      }
    ];

    const $ = id => document.getElementById(id);
    const storageKey = "math-quest-academy-v1";
    const perRealm = 10;
    const placementLength = realms.length * perRealm;
    const checkpointLength = 4;

    let state = {
      xp: 0,
      diagnostic: [],
      pending: null,
      cleared: realms.map(realm => realm.chapters.map(() => false)),
      mistakes: []
    };

    try {
      const saved = JSON.parse(localStorage.getItem(storageKey));
      if (saved && Array.isArray(saved.diagnostic) && Array.isArray(saved.cleared) &&
          Array.isArray(saved.mistakes) && Number.isFinite(saved.xp)) {
        state = saved;
      }
    } catch {
      $("notice").textContent = "Saved progress could not be loaded.";
    }

    function save() {
      try {
        localStorage.setItem(storageKey, JSON.stringify(state));
      } catch {
        $("notice").textContent = "Browser storage is unavailable. Progress lasts for this session.";
      }
      $("xp").textContent = `${state.xp} XP`;
    }

    function random(min, max) {
      return min + Math.floor(Math.random() * (max - min + 1));
    }

    function shuffle(items) {
      const copy = [...items];
      for (let i = copy.length - 1; i > 0; i -= 1) {
        const j = random(0, i);
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function problem(prompt, answer, distractors, hint, solution) {
      const correct = String(answer);
      const choices = [...new Set([correct, ...distractors.map(String)])];
      for (let offset = 1; choices.length < 4; offset += 1) {
        const alternative = String(Number(correct) + offset);
        if (!choices.includes(alternative)) choices.push(alternative);
      }
      return { prompt, correct, choices: shuffle(choices), hint, solution };
    }

    function generate(realm, level, recent = []) {
      const families = realms[realm].chapters[level].problems;
      let next;
      for (let attempt = 0; attempt < 16; attempt += 1) {
        next = families[random(0, families.length - 1)]();
        if (!recent.includes(next.prompt)) break;
      }
      return next;
    }

    function el(tag, text, className) {
      const node = document.createElement(tag);
      if (text !== undefined) node.textContent = text;
      if (className) node.className = className;
      return node;
    }

    function button(label, action, primary = false) {
      const node = el("button", label, primary ? "primary" : undefined);
      node.type = "button";
      node.addEventListener("click", action);
      return node;
    }

    function openScreen(label, title) {
      $("map").hidden = true;
      const screen = $("screen");
      const heading = el("h2", title);
      heading.tabIndex = -1;
      screen.hidden = false;
      screen.replaceChildren(el("p", label, "eyebrow"), heading);
      heading.focus();
      return screen;
    }

    function note(heading, message) {
      const box = el("div", undefined, "note");
      box.append(el("h3", heading), el("p", message));
      return box;
    }

    function meter(value, max, label) {
      const progress = el("progress");
      progress.max = max;
      progress.value = value;
      progress.setAttribute("aria-label", label);
      return progress;
    }

    function finishedPlacement() {
      return state.diagnostic.length >= placementLength;
    }

    function questionsFor(realm) {
      return state.diagnostic.filter(entry => entry.realm === realm);
    }

    // Start each realm in the middle. Only that realm's answers change its difficulty.
    function difficultyFor(realm) {
      return questionsFor(realm).reduce((level, entry) => {
        return Math.max(0, Math.min(2, level + (entry.passed ? 1 : -1)));
      }, 1);
    }

    // Recommend Chapter I until there is evidence for Chapter II, and vice versa.
    function placementFor(realm) {
      const answers = questionsFor(realm);
      const hardSuccesses = answers.filter(entry => entry.level === 2 && entry.passed).length;
      const middleOrHardSuccesses = answers.filter(entry => entry.level >= 1 && entry.passed).length;
      if (hardSuccesses >= 3) return 2;
      if (middleOrHardSuccesses >= 2) return 1;
      return 0;
    }

    function unlocked(realm, level) {
      if (!finishedPlacement()) return false;
      return level <= placementFor(realm) || state.cleared[realm][level - 1];
    }

    function showMap() {
      $("screen").hidden = true;
      $("map").hidden = false;
      $("xp").textContent = `${state.xp} XP`;
      const done = finishedPlacement();
      const quest = $("questButton");
      quest.textContent = done ? "View placement report" :
        state.diagnostic.length ? "Resume placement quest" : "Start placement quest";
      quest.onclick = done ? showReport : showDiagnostic;

      const worlds = $("worlds");
      worlds.replaceChildren();

      realms.forEach((realm, realmIndex) => {
        const card = el("article", undefined, "world");
        card.style.setProperty("--world", realm.color);

        const heading = el("div", undefined, "world-head");
        const sigil = el("span", realm.icon, "sigil");
        sigil.setAttribute("aria-hidden", "true");
        heading.append(sigil, el("h3", realm.name));
        card.append(heading, el("p", realm.subject));

        realm.chapters.forEach((chapter, level) => {
          const preview = el("details");
          const cleared = state.cleared[realmIndex][level];
          const recommended = done && placementFor(realmIndex) === level && !cleared;
          const suffix = cleared ? " · Cleared" : recommended ? " · Start here" : "";
          preview.append(
            el("summary", `Chapter ${level + 1} · ${chapter.title}${suffix}`),
            el("p", chapter.goal),
            note("Worked example", chapter.example)
          );
          if (unlocked(realmIndex, level)) {
            preview.append(button(cleared ? "Replay chapter" : "Enter chapter",
              () => showLesson(realmIndex, level), recommended));
          } else {
            preview.append(el("p", done ? "Clear the previous chapter to enter." : "Complete placement to enter."));
          }
          preview.open = recommended;
          card.append(preview);
        });

        worlds.append(card);
      });

      drawWorld();
    }

    function answerGrid(parent, question, onSelect) {
      const grid = el("div", undefined, "answers");
      const controls = [];
      question.choices.forEach(option => {
        const control = button(option, () => {
          controls.forEach(choice => choice.setAttribute("aria-pressed", String(choice === control)));
          onSelect(option);
        });
        control.setAttribute("aria-pressed", "false");
        controls.push(control);
        grid.append(control);
      });
      parent.append(grid);
      return controls;
    }

    function showDiagnostic() {
      if (finishedPlacement()) {
        showReport();
        return;
      }

      const index = state.diagnostic.length;
      const realm = index % realms.length;
      const level = difficultyFor(realm);

      if (!state.pending) {
        const recent = questionsFor(realm).map(entry => entry.question.prompt);
        state.pending = generate(realm, level, recent);
        save();
      }

      const question = state.pending;
      const screen = openScreen(`Placement quest · ${index + 1} of ${placementLength}`, question.prompt);
      screen.append(meter(index, placementLength, "Placement questions submitted"));
      let selected = null;

      function submit(answer) {
        if (state.diagnostic.length !== index) return;
        state.diagnostic.push({ realm, level, question, answer, passed: answer === question.correct });
        state.pending = null;
        save();
        showDiagnostic();
      }

      const next = button(index === placementLength - 1 ? "See my placement" : "Next question",
        () => submit(selected), true);
      next.disabled = true;
      answerGrid(screen, question, option => {
        selected = option;
        next.disabled = false;
      });
      const actions = el("div", undefined, "actions");
      actions.append(next, button("I’m not sure", () => submit(null)));
      screen.append(actions);
    }

    function showReport() {
      const screen = openScreen("Placement complete", "Your starting chapters");
      screen.append(el("p", "Each realm has its own starting chapter. You can also visit earlier chapters to review."));
      const grid = el("div", undefined, "worlds");
      realms.forEach((realm, index) => {
        const level = placementFor(index);
        const tile = note(realm.name, `Chapter ${level + 1} · ${realm.chapters[level].title}`);
        tile.append(button("Open lesson", () => showLesson(index, level), true));
        grid.append(tile);
      });
      screen.append(grid);
    }

    function showLesson(realm, level) {
      const chapter = realms[realm].chapters[level];
      const screen = openScreen(`${realms[realm].name} · Chapter ${level + 1}`, chapter.title);
      screen.append(
        el("p", chapter.goal),
        note("Worked example", chapter.example),
        el("p", "Train with hints and explanations. When you’re ready, pass the checkpoint with at least 3 correct answers out of 4."),
        button("Enter training", () => showTraining(realm, level, []), true)
      );
    }

    function addMistake(realm, level, question, answer) {
      const entry = { realm, level, question, answer };
      state.mistakes = [
        entry,
        ...state.mistakes.filter(item => item.question.prompt !== question.prompt)
      ].slice(0, 80);
    }

    function showTraining(realm, level, recent) {
      const question = generate(realm, level, recent);
      const nextRecent = [...recent, question.prompt].slice(-10);
      const screen = openScreen(`${realms[realm].name} · Training`, question.prompt);
      let answered = false;
      let usedHint = false;

      const controls = answerGrid(screen, question, option => {
        if (answered) return;
        answered = true;
        controls.forEach(control => { control.disabled = true; });
        hintButton.disabled = true;

        const correct = option === question.correct;
        if (correct) state.xp += usedHint ? 2 : 5;
        else addMistake(realm, level, question, option);
        save();

        const result = note(correct ? "Correct!" : `Correct answer: ${question.correct}`, question.solution);
        result.classList.add(correct ? "good" : "bad");
        result.tabIndex = -1;
        screen.append(result, button("Next training problem", () => showTraining(realm, level, nextRecent), true));
        result.focus();
      });

      const hintButton = button("Reveal hint", () => {
        usedHint = true;
        hintButton.disabled = true;
        const hint = note("Hint", question.hint);
        hint.tabIndex = -1;
        screen.append(hint);
        hint.focus();
      });
      const actions = el("div", undefined, "actions");
      actions.append(hintButton, button("Start checkpoint", () => checkpoint(realm, level, [])));
      screen.append(actions);
    }

    function checkpoint(realm, level, attempt) {
      if (attempt.length === checkpointLength) {
        const score = attempt.filter(item => item.passed).length;
        const passed = score >= 3;
        const firstClear = passed && !state.cleared[realm][level];
        if (firstClear) {
          state.cleared[realm][level] = true;
          state.xp += 25;
        }

        attempt.filter(item => !item.passed)
          .forEach(item => addMistake(realm, level, item.question, item.answer));
        save();

        const screen = openScreen("Checkpoint results", passed ? "Chapter cleared!" : "Keep training");
        screen.append(el("p", `${score}/${checkpointLength} correct${firstClear ? " · +25 XP" : ""}`));
        attempt.filter(item => !item.passed).forEach(item => {
          screen.append(note(item.question.prompt, item.question.solution));
        });

        const actions = el("div", undefined, "actions");
        if (passed && level < realms[realm].chapters.length - 1) {
          actions.append(button("Enter next chapter", () => showLesson(realm, level + 1), true));
        }
        actions.append(button("Back to training", () => showTraining(realm, level, [])), button("World map", showMap));
        screen.append(actions);
        return;
      }

      const question = generate(realm, level, attempt.map(item => item.question.prompt));
      const screen = openScreen(`Checkpoint · ${attempt.length + 1} of ${checkpointLength}`, question.prompt);
      let selected = null;
      let submitted = false;
      const next = button(attempt.length === checkpointLength - 1 ? "Finish checkpoint" : "Next question", () => {
        if (submitted || selected === null) return;
        submitted = true;
        checkpoint(realm, level, [
          ...attempt,
          { question, answer: selected, passed: selected === question.correct }
        ]);
      }, true);
      next.disabled = true;
      answerGrid(screen, question, option => {
        selected = option;
        next.disabled = false;
      });
      screen.append(next);
    }

    function showJournal() {
      const screen = openScreen("Review", "Quest journal");
      const placementMisses = finishedPlacement() ? state.diagnostic.filter(item => !item.passed) : [];
      const entries = [...state.mistakes, ...placementMisses];

      if (!entries.length) {
        screen.append(el("p", "Missed questions and their worked solutions will appear here after placement or practice."));
      }

      entries.forEach(entry => {
        const item = el("details");
        item.append(
          el("summary", entry.question.prompt),
          el("p", `Your answer: ${entry.answer ?? "Skipped"}. Correct answer: ${entry.question.correct}.`),
          el("p", entry.question.solution)
        );
        screen.append(item);
      });
    }

    // Draw the academy scene with Canvas. It scales to the screen and works offline.
    function drawWorld() {
      const canvas = $("sky");
      const rect = canvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return;
      const density = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(rect.width * density);
      canvas.height = Math.round(rect.height * density);

      const ctx = canvas.getContext("2d");
      if (!ctx) return;
      ctx.scale(canvas.width / 1000, canvas.height / 400);

      const sky = ctx.createLinearGradient(0, 0, 0, 400);
      sky.addColorStop(0, "#161638");
      sky.addColorStop(.63, "#364476");
      sky.addColorStop(1, "#52648b");
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, 1000, 400);

      function polygon(points, color) {
        ctx.beginPath();
        points.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
        ctx.closePath();
        ctx.fillStyle = color;
        ctx.fill();
      }

      function disc(x, y, radius, color) {
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
      }

      for (let i = 0; i < 90; i += 1) {
        const x = (i * 173 + 13) % 1000;
        const y = (i * 71 + 17) % 245;
        disc(x, y, i % 9 === 0 ? 2 : .85, i % 5 === 0 ? "#fff1ca" : "#9eaee0");
      }

      const moon = ctx.createRadialGradient(800, 102, 16, 800, 102, 140);
      moon.addColorStop(0, "#a394ff70");
      moon.addColorStop(1, "#a394ff00");
      disc(800, 102, 140, moon);
      disc(800, 102, 43, "#e9d7ff");
      disc(814, 89, 9, "#cfbdef");
      disc(784, 114, 5, "#cfbdef");

      polygon([[0,310],[115,184],[230,295],[360,219],[460,297],[600,162],[742,298],[870,193],[1000,265],[1000,400],[0,400]], "#2c3c69");
      polygon([[0,355],[170,282],[330,338],[509,257],[692,335],[805,254],[1000,332],[1000,400],[0,400]], "#1d2f55");
      polygon([[0,378],[270,345],[540,378],[760,312],[1000,354],[1000,400],[0,400]], "#152746");

      function tower(x, y, width, height) {
        ctx.fillStyle = "#141e3f";
        ctx.fillRect(x, y, width, height);
        ctx.fillStyle = "#28345e";
        ctx.fillRect(x + width * .55, y, width * .45, height);
        polygon([[x - 7, y], [x + width / 2, y - 36], [x + width + 7, y]], "#55478b");
        for (let row = 0; row < height - 18; row += 24) {
          ctx.fillStyle = "#ffd997";
          ctx.fillRect(x + width / 2 - 4, y + 12 + row, 8, 11);
        }
      }

      tower(674, 232, 34, 72);
      tower(718, 194, 49, 105);
      tower(775, 165, 52, 133);
      tower(839, 209, 43, 100);
      tower(891, 242, 34, 68);

      ctx.strokeStyle = "#86ffd5aa";
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 9]);
      ctx.beginPath();
      ctx.moveTo(485, 367);
      ctx.quadraticCurveTo(663, 319, 797, 313);
      ctx.stroke();
      ctx.setLineDash([]);
      disc(620, 337, 5, "#86ffd5");
      disc(797, 313, 7, "#ffd884");
    }

    $("mapButton").addEventListener("click", showMap);
    $("journalButton").addEventListener("click", showJournal);
    window.addEventListener("resize", drawWorld);
    showMap();
  </script>
</body>
</html>
