<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Math Quest RPG</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f7f5ff;
      --muted: #c2cce8;
      --panel: #181c35;
      --edge: #424c70;
      --mint: #9dffd7;
      --gold: #ffdb85;
      --rose: #ffb1c7;
      --realm: #a2b8ff;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: radial-gradient(ellipse at 75% 0%, #302750, transparent 50%), #0d1022;
      font: 1rem/1.55 system-ui, sans-serif;
      min-height: 100vh;
    }

    header, main { width: min(1080px, calc(100% - 28px)); margin: auto; }
    header { display: flex; justify-content: space-between; padding: 16px 0; }
    header, nav, .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    main { padding-bottom: 50px; }
    h1, h2, h3, p { margin: 0 0 .65em; }
    h1 { font-size: clamp(2.4rem, 8vw, 5.6rem); line-height: 1; letter-spacing: -.055em; }
    h2 { font-size: clamp(1.5rem, 4vw, 2.4rem); line-height: 1.14; }
    h3 { line-height: 1.3; }
    p { color: var(--muted); }
    .brand, .eyebrow { color: var(--mint); font-weight: 850; letter-spacing: .07em; }
    .eyebrow { font-size: .82rem; text-transform: uppercase; }
    .gold { color: var(--gold); }

    button, input {
      min-height: 44px;
      border: 1px solid var(--edge);
      border-radius: 11px;
      padding: 9px 14px;
      color: var(--ink);
      background: #263050;
      font: inherit;
    }

    button { font-weight: 750; cursor: pointer; }
    button:hover:not(:disabled) { border-color: var(--mint); }
    button:disabled { opacity: .55; cursor: default; }
    button.primary { background: var(--mint); border-color: var(--mint); color: #10231e; }
    button[aria-pressed="true"] { outline: 2px solid var(--realm); }
    :focus-visible { outline: 3px solid var(--gold); outline-offset: 4px; }
    input { flex: 1 1 140px; min-width: 0; }

    .panel, .tile, .note {
      border: 1px solid var(--edge);
      border-radius: 18px;
      background: var(--panel);
      padding: clamp(15px, 4vw, 30px);
    }

    .panel { margin-top: 14px; }
    .tile, .note { padding: 15px; background: #202745; }
    .note { margin: 14px 0; }
    .note p:last-child, .tile p:last-child { margin-bottom: 0; }
    .note ol { padding-left: 24px; margin-bottom: 0; }
    .note li { margin: 6px 0; }
    .good { color: var(--mint); }
    .bad { color: var(--rose); }
    .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr)); }
    .unit { border-top: 1px solid var(--edge); padding: 12px 0; }
    summary { cursor: pointer; font-weight: 750; }
    .level { display: grid; gap: 3px; text-align: left; }
    .level small { font-weight: 500; color: var(--muted); }
    .question { font-size: clamp(1.23rem, 3vw, 1.85rem); }
    progress { width: 100%; height: 13px; accent-color: var(--mint); }
    form label { width: 100%; font-weight: 700; }

    .landscape {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      display: grid;
      align-items: center;
      min-height: 340px;
      padding: clamp(20px, 6vw, 62px);
      border: 1px solid #68669a;
      border-radius: 24px;
      background:
        radial-gradient(circle at 77% 29%, #f7deff 0 29px, #e9a8ff57 30px, transparent 80px),
        radial-gradient(circle at 19% 23%, #fff 0 1px, transparent 2px) 0 0 / 83px 67px,
        radial-gradient(circle at 81% 41%, #dfcaff 0 1px, transparent 2px) 0 0 / 139px 93px,
        linear-gradient(160deg, #151334, #42386f 65%, #c0759b);
    }

    .landscape::before, .landscape::after {
      content: "";
      position: absolute;
      inset: 23% 0 0;
      z-index: -2;
      background: #363868;
      clip-path: polygon(0 83%, 12% 48%, 24% 75%, 39% 16%, 53% 65%, 70% 32%, 86% 63%, 100% 27%, 100% 100%, 0 100%);
    }

    .landscape::after {
      inset: 40% 0 0;
      z-index: -1;
      background: linear-gradient(#23375c, #101c36);
      clip-path: polygon(0 54%, 17% 73%, 32% 49%, 51% 78%, 68% 62%, 81% 32%, 100% 55%, 100% 100%, 0 100%);
    }

    .hero-copy { max-width: 450px; text-shadow: 0 2px 12px #0e1027; }
    .hero-copy p { color: #f2ecff; }
    .map-trail {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 14px;
    }
    .map-trail button {
      min-width: 0;
      min-height: 98px;
      padding: 8px;
      overflow-wrap: anywhere;
      background: linear-gradient(145deg, #2c395f, #222642);
    }
    .map-trail span { display: block; font-size: 1.65rem; }
    .trail-active { color: var(--mint); }
    .arena {
      min-height: 180px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: end;
      gap: 12px;
      padding: 16px;
      border-radius: 16px;
      background:
        radial-gradient(ellipse at 20% 105%, #7f61ca71, transparent 54%),
        radial-gradient(ellipse at 86% 15%, #65dbea30, transparent 45%),
        linear-gradient(#171739 65%, #253052 66%);
    }

    .fighter { text-align: center; min-width: 0; }
    .fighter strong { display: block; }
    .sprite {
      display: block;
      width: 64px;
      height: 64px;
      margin: 0 auto 12px;
      border-radius: 23px 23px 17px 17px;
      background:
        radial-gradient(circle at 35% 45%, #f5fff9 0 4px, transparent 5px),
        radial-gradient(circle at 65% 45%, #f5fff9 0 4px, transparent 5px),
        linear-gradient(145deg, #9d99ff, #6049b2 66%, #382d76);
      border: 3px solid #c7b9ff;
      box-shadow: 0 10px 22px #0007, inset 0 -10px #291c6444;
      animation: hover 2.8s ease-in-out infinite alternate;
    }
    .sprite.monster {
      border-color: #ffc189;
      border-radius: 31px 31px 13px 13px;
      background:
        radial-gradient(circle at 34% 46%, #2f142d 0 5px, transparent 6px),
        radial-gradient(circle at 66% 46%, #2f142d 0 5px, transparent 6px),
        linear-gradient(145deg, #ffe08b, #e47988 70%, #7d385f);
      animation-delay: -.9s;
    }
    .fighter:last-child progress { accent-color: var(--rose); }
    #notice:empty { display: none; }
    @keyframes hover { to { transform: translateY(-7px) rotate(3deg); } }
    @media (prefers-reduced-motion: reduce) { .sprite { animation: none; } }
  </style>
</head>
<body>
  <header>
    <div class="brand">✦ Math Quest RPG</div>
    <nav aria-label="Game navigation">
      <button id="mapButton" type="button">World map</button>
      <button id="shopButton" type="button">Shop</button>
      <button id="journalButton" type="button">Journal</button>
    </nav>
    <strong id="inventory" class="gold"></strong>
  </header>
  <main>
    <p id="notice" role="status"></p>
    <div id="app"></div>
  </main>

  <script>
    "use strict";

    const ranks = ["Apprentice", "Scout", "Knight", "Master"];
    const checkpointLength = 4;
    const diagnosticLength = 30;
    const startingHP = 3;
    const storageKey = "math-quest-rpg-120-v1";

    function skill(title, rule, create) {
      return { title, rule, create };
    }

    function question(prompt, answer, steps) {
      return { prompt, answer, steps };
    }

    function choose(n, k) {
      let result = 1;
      for (let i = 1; i <= k; i += 1) {
        result = result * (n - i + 1) / i;
      }
      return Math.round(result);
    }

    function factorial(n) {
      let result = 1;
      for (let i = 2; i <= n; i += 1) result *= i;
      return result;
    }

    function gcd(a, b) {
      while (b !== 0) {
        [a, b] = [b, a % b];
      }
      return a;
    }

    const realms = [
      {
        name: "Number Forge",
        icon: "✹",
        color: "#ffc081",
        foe: " Ember Golem",
        units: [
          skill("Place Value & Subtraction", "Break the amount you subtract into place values. Subtract those chunks separately.",
            (n, r) => {
              const a = 84 + n + 100 * r;
              const b = 16 + n % 9 + 67 * r;
              const first = b - b % 10;
              return question(`${a} − ${b} = ?`, a - b, [
                `Break ${b} into ${first} + ${b % 10}.`,
                `Subtract the first chunk: ${a} − ${first} = ${a - first}.`,
                `Subtract the ones: ${a - first} − ${b % 10} = ${a - b}.`
              ]);
            }),
          skill("Distributive Multiplication", "Split a factor into easier pieces. Multiply each piece and add the partial products.",
            (n, r) => {
              const a = 12 + n + 11 * r, b = 3 + r + n % 4;
              const tens = a - a % 10, ones = a % 10;
              return question(`${a} × ${b} = ?`, a * b, [
                `Write ${a} as ${tens} + ${ones}.`,
                `Multiply each part by ${b}: ${tens * b} and ${ones * b}.`,
                `Add the partial products to get ${a * b}.`
              ]);
            }),
          skill("Greatest Common Factors", "A common factor divides both numbers evenly. The remainder method preserves their common factors.",
            (n, r) => {
              const d = 3 + n;
              const a = d * (3 + r), b = d * (5 + r);
              const answer = gcd(a, b);
              return question(`Find the greatest common factor of ${a} and ${b}.`, answer, [
                `Divide ${b} by ${a} and keep the remainder ${b % a}.`,
                "Keep dividing the previous divisor by the remainder until the remainder becomes zero.",
                `The last nonzero remainder or divisor is ${answer}.`
              ]);
            }),
          skill("Least Common Multiples", "The least common multiple is the smallest positive number both inputs divide evenly.",
            (n, r) => {
              const a = n + 6, b = n + 10 + 2 * r;
              const common = gcd(a, b);
              return question(`Find the least common multiple of ${a} and ${b}.`, a * b / common, [
                `Find the greatest common factor: ${common}.`,
                "The product counts the shared factor twice, so divide it by the greatest common factor.",
                `${a} × ${b} ÷ ${common} = ${a * b / common}.`
              ]);
            }),
          skill("Fractions of a Whole", "The denominator tells you how many equal parts make the whole. The numerator tells you how many parts to take.",
            (n, r) => {
              const numerator = r + 2, denominator = r + 5;
              const part = n + 4;
              return question(`What is ${numerator}/${denominator} of ${part * denominator}?`, part * numerator, [
                `Divide the whole by ${denominator} to find one part: ${part}.`,
                `Take ${numerator} parts: ${part} × ${numerator} = ${part * numerator}.`
              ]);
            }),
          skill("Adding Fractions", "Fractions need a common denominator before you can add their numerators.",
            (n, r) => {
              const denominator = 5 + r;
              const numerator = 1 + n % (denominator - 1);
              return question(`Write ${numerator}/${denominator} + 1/${2 * denominator} with denominator ${2 * denominator}. What is its numerator?`, 2 * numerator + 1, [
                `Multiply the first numerator and denominator by 2 to get ${2 * numerator}/${2 * denominator}.`,
                `Add the numerators: ${2 * numerator} + 1 = ${2 * numerator + 1}.`
              ]);
            }),
          skill("Unit Rates", "Divide a total by the number of units to find the amount per unit. Then scale by the requested number.",
            (n, r) => {
              const count = 4 + r, rate = n + 2, target = 7 + r * 2;
              return question(`${count} notebooks cost $${count * rate}. At the same rate, what do ${target} notebooks cost in dollars?`, rate * target, [
                `Find the cost of one notebook: ${count * rate} ÷ ${count} = $${rate}.`,
                `Multiply by ${target}: $${rate * target}.`
              ]);
            }),
          skill("Percent of a Number", "Percent means out of 100. Change the percent to a fraction or decimal and multiply.",
            (n, r) => {
              const percent = [15, 35, 65, 125][r], total = 20 * (n + 3);
              const answer = percent * total / 100;
              return question(`What is ${percent}% of ${total}?`, answer, [
                `${percent}% means ${percent}/100.`,
                `Multiply ${total} × ${percent}/100 to get ${answer}.`
              ]);
            }),
          skill("Reverse Percent Changes", "The final amount equals the original amount times a multiplier. Divide by that multiplier to work backward.",
            (n, r) => {
              const discount = [10, 25, 35, 45][r], original = 20 * (n + 5);
              const paid = 100 - discount, sale = original * paid / 100;
              return question(`After a ${discount}% discount, an item costs $${sale}. Find its original price in dollars.`, original, [
                `A ${discount}% discount leaves ${paid}% of the original price.`,
                `Write final price = original price × ${paid / 100}.`,
                `Divide ${sale} by ${paid / 100} to get $${original}.`
              ]);
            }),
          skill("Linear Equations", "Undo the operations around the unknown in reverse order. Apply each step to both sides.",
            (n, r) => {
              const x = n - 9, a = 3 + r, b = 4 + r * 2;
              return question(`Solve for x: ${a}x + ${b} = ${a * x + b}.`, x, [
                `Subtract ${b} from both sides to get ${a}x = ${a * x}.`,
                `Divide both sides by ${a} to get x = ${x}.`,
                `Check: ${a} × (${x}) + ${b} = ${a * x + b}.`
              ]);
            })
        ]
      },
      {
        name: "Counting Forest",
        icon: "❋",
        color: "#90efbb",
        foe: " Moss Mimic",
        units: [
          skill("Multiplication Principle", "If every first choice can be paired with every second choice, multiply the counts.",
            (n, r) => {
              const a = 3 + n % 7 + r, b = 2 + n % 5;
              return question(`Choose one of ${a} hats and one of ${b} capes. How many outfits can you make?`, a * b, [
                `Each hat can be paired with ${b} capes.`,
                `There are ${a} hats, so there are ${a} × ${b} = ${a * b} outfits.`
              ]);
            }),
          skill("Codes With Repetition", "With repetition allowed, each position has the same set of choices.",
            (n, r) => {
              const symbols = 3 + n % 6, slots = 2 + r;
              return question(`A code uses ${slots} symbols. Each position has ${symbols} choices, and repeats are allowed. How many codes are possible?`, symbols ** slots, [
                `Every one of the ${slots} positions has ${symbols} choices.`,
                `Multiply ${symbols} by itself ${slots} times: ${symbols}^${slots} = ${symbols ** slots}.`
              ]);
            }),
          skill("Codes Without Repetition", "Used symbols are unavailable. The number of choices drops by one at each position.",
            (n, r) => {
              const slots = 2 + r, size = slots + 2 + n % 5;
              const factors = Array.from({ length: slots }, (_, i) => size - i);
              const total = factors.reduce((a, b) => a * b, 1);
              return question(`A ${slots}-position code is made from ${size} distinct symbols. No symbol repeats. How many codes are possible?`, total, [
                `The first position has ${size} choices. Each later position has one fewer.`,
                `${factors.join(" × ")} = ${total}.`
              ]);
            }),
          skill("Distinct Roles", "When roles are different, swapping two people changes the assignment.",
            (n, r) => {
              const people = n + 5 + r;
              return question(`Choose a captain and a deputy from ${people} students. The roles must go to different students. How many assignments are possible?`, people * (people - 1), [
                `Choose the captain in ${people} ways.`,
                `Choose the deputy from the ${people - 1} remaining students.`,
                `Multiply to get ${people * (people - 1)} assignments.`
              ]);
            }),
          skill("Unordered Teams", "Each set of people can be listed in several orders. Divide the ordered count by the number of orders per team.",
            (n, r) => {
              const size = 2 + r, people = size + 4 + n % 6;
              const orderings = Array.from({ length: size }, (_, i) => people - i);
              return question(`How many ${size}-person teams can be chosen from ${people} students?`, choose(people, size), [
                `Count ordered selections with ${orderings.join(" × ")}.`,
                `Each team appears in ${size}! = ${factorial(size)} orders.`,
                `Divide by ${factorial(size)} to get ${choose(people, size)} teams.`
              ]);
            }),
          skill("Arrangements & Blocks", "Treat items that must stay together as one block. Then count the orders inside that block.",
            (n, r) => {
              const books = 4 + r + n % 3, block = 2 + r % 2;
              const objects = books - block + 1;
              const total = factorial(objects) * factorial(block);
              return question(`Arrange ${books} different books in a row. A specified group of ${block} books must stay together. How many arrangements are possible?`, total, [
                `Treat those ${block} books as one object, giving ${objects} objects to arrange.`,
                `Arrange the objects in ${objects}! ways and the books inside the block in ${block}! ways.`,
                `Multiply ${factorial(objects)} × ${factorial(block)} = ${total}.`
              ]);
            }),
          skill("Counting the Complement", "Count every possible outcome, then subtract the ones that fail the condition.",
            (n, r) => {
              const slots = 3 + r, symbols = 3 + n % 4;
              const answer = symbols ** slots - (symbols - 1) ** slots;
              return question(`Make a ${slots}-position code from digits 1 through ${symbols}, with repetition allowed. How many codes contain at least one 1?`, answer, [
                `There are ${symbols}^${slots} = ${symbols ** slots} unrestricted codes.`,
                `Without digit 1, each position has ${symbols - 1} choices, giving ${(symbols - 1) ** slots} codes.`,
                `Subtract the unwanted codes to get ${answer}.`
              ]);
            }),
          skill("Exactly k Heads", "Choose which positions contain heads. All the other positions have to be tails.",
            (n, r) => {
              const flips = 5 + r + n % 4, heads = 1 + r;
              return question(`A coin is flipped ${flips} times. How many ordered sequences have exactly ${heads} ${heads === 1 ? "head" : "heads"}?`, choose(flips, heads), [
                `Choose ${heads} of the ${flips} positions for heads.`,
                "Fill all remaining positions with tails. Each choice gives exactly one sequence.",
                `There are ${choose(flips, heads)} choices.`
              ]);
            }),
          skill("Probability With Dice", "For fair dice, probability equals the number of favorable ordered outcomes divided by the number of all ordered outcomes.",
            (n, r) => {
              const rolls = 2 + r + n % 2;
              const answer = 6 ** rolls - 5 ** rolls;
              return question(`Roll a fair six-sided die ${rolls} times. The probability of at least one 6 is k/${6 ** rolls}. Find k.`, answer, [
                `Every roll has 6 possible results, giving ${6 ** rolls} ordered outcomes.`,
                `Each roll has 5 non-six results, so ${5 ** rolls} outcomes contain no six.`,
                `Subtract to get ${answer} favorable outcomes.`
              ]);
            }),
          skill("The Pigeonhole Principle", "To avoid a guaranteed group of a certain size, first fill each category just below that size. One additional item forces the group.",
            (n, r) => {
              const colors = 3 + n % 7, target = 2 + r;
              const safe = colors * (target - 1);
              return question(`A bag has socks of ${colors} colors, with at least ${target} of each color. How many socks must you draw blindly to guarantee ${target} socks of the same color?`, safe + 1, [
                `You could draw ${target - 1} socks of each color without succeeding.`,
                `That could use ${colors} × ${target - 1} = ${safe} socks.`,
                `One more forces some color to reach ${target}. The answer is ${safe + 1}.`
              ]);
            })
        ]
      },
      {
        name: "Geometry Citadel",
        icon: "▲",
        color: "#c9b3ff",
        foe: " Prism Drake",
        units: [
          skill("Rectangle Perimeter", "Perimeter is the distance around a figure. A rectangle has two lengths and two widths.",
            (n, r) => {
              const a = 8 + n + r * 3, b = 3 + r + n % 5;
              return question(`Find the perimeter of a rectangle with sides ${a} and ${b}.`, 2 * (a + b), [
                `Add one length and one width: ${a} + ${b} = ${a + b}.`,
                `Double that sum to include all four sides: ${2 * (a + b)}.`
              ]);
            }),
          skill("Area & Missing Sides", "Rectangle area is length times width. Divide the area by a known side to recover the missing side.",
            (n, r) => {
              const a = 7 + n, b = 3 + r + n % 4, area = a * b;
              return question(`A rectangle has area ${area} and width ${b}. Find its length.`, a, [
                `Write area = length × width, so ${area} = length × ${b}.`,
                `Divide both sides by ${b}. The length is ${a}.`
              ]);
            }),
          skill("Triangle Area", "A triangle has half the area of a parallelogram with the same base and perpendicular height.",
            (n, r) => {
              const b = n + 8, h = 2 * (3 + r + n % 4);
              return question(`A triangle has base ${b} and perpendicular height ${h}. Find its area.`, b * h / 2, [
                `Use the perpendicular height ${h} with base ${b}.`,
                `Multiply base by height, then halve: ${b} × ${h} ÷ 2 = ${b * h / 2}.`
              ]);
            }),
          skill("Trapezoid Area", "Multiply the average of the parallel sides by the perpendicular distance between them.",
            (n, r) => {
              const a = 4 + n, b = a + r + 3, h = 4 + 2 * r;
              return question(`A trapezoid has parallel sides ${a} and ${b} and height ${h}. Find its area.`, (a + b) * h / 2, [
                `Add the parallel sides to get ${a + b}.`,
                `Take half that sum and multiply by ${h}: ${a + b} × ${h} ÷ 2 = ${(a + b) * h / 2}.`
              ]);
            }),
          skill("Polygon Angles", "Draw diagonals from one vertex of a convex polygon to split it into two fewer triangles than it has sides.",
            (n, r) => {
              const sides = 5 + r + n % 6;
              return question(`Find the sum of the interior angles of a convex ${sides}-sided polygon, in degrees.`, (sides - 2) * 180, [
                `The diagonals from one vertex create ${sides - 2} triangles.`,
                `Each triangle contributes 180°, so the sum is ${sides - 2} × 180° = ${(sides - 2) * 180}°.`
              ]);
            }),
          skill("The Pythagorean Theorem", "For a right triangle, the squares of the legs add to the square of the hypotenuse.",
            (n, r) => {
              const scale = 2 + n % 5;
              const [a, b, c] = [[3, 4, 5], [5, 12, 13], [8, 15, 17], [7, 24, 25]][r]
                .map(side => side * scale);
              return question(`A right triangle has hypotenuse ${c} and one leg ${a}. Find the other leg.`, b, [
                `Set up ${a}² + x² = ${c}².`,
                `Subtract ${a}² to get x² = ${c * c - a * a}.`,
                `Take the positive square root because x is a length. The missing leg is ${b}.`
              ]);
            }),
          skill("Similar Figures", "Corresponding lengths of similar figures follow the same scale factor. Their areas scale by the square of that factor.",
            (n, r) => {
              const factor = 2 + r, area = 12 + n;
              return question(`A triangle of area ${area} is enlarged so every side becomes ${factor} times as long. Find the new area.`, area * factor ** 2, [
                `Both the base and the height scale by ${factor}.`,
                `The area therefore scales by ${factor} × ${factor} = ${factor ** 2}.`,
                `Multiply ${area} × ${factor ** 2} = ${area * factor ** 2}.`
              ]);
            }),
          skill("Coordinate Distance", "Use horizontal and vertical differences as the legs of a right triangle.",
            (n, r) => {
              const x = n - 11, y = r - 5;
              const scale = r + 1;
              const a = 3 * scale, b = 4 * scale;
              return question(`Find the distance from (${x}, ${y}) to (${x + a}, ${y + b}).`, 5 * scale, [
                `The horizontal change is ${a} and the vertical change is ${b}.`,
                `The distance is √(${a}² + ${b}²) = √${a * a + b * b} = ${5 * scale}.`
              ]);
            }),
          skill("Circle Equations", "In (x − h)² + (y − k)² = r², the center is (h, k). The equation measures squared distance from that center.",
            (n, r) => {
              const h = n + 1, k = r + 2, radius = 3 + r + n % 6;
              return question(`The circle (x − ${h})² + (y + ${k})² = ${radius ** 2} encloses an area of aπ. Find a.`, radius ** 2, [
                `The center is (${h}, −${k}). Those coordinates make both squared expressions zero.`,
                `The equation sets squared distance equal to ${radius ** 2}, so the radius is ${radius}.`,
                `Area = πr² = ${radius ** 2}π. The requested coefficient is ${radius ** 2}.`
              ]);
            }),
          skill("The Sliding Ladder", "A ladder’s fixed length links two changing distances through the Pythagorean theorem. The full graph of that equation is a circle.",
            (n, r) => {
              const half = 2 + r + n % 8, length = 2 * half;
              return question(`A ${length}-ft ladder starts at 45°. Let x measure how far its base moves toward the wall and y how far its top moves up. The full graph of their equation encloses aπ square feet. Find a.`, length ** 2, [
                `At 45°, the height and distance from the wall are both ${length}/√2 = ${half}√2.`,
                `After moving, the squared legs give (${half}√2 − x)² + (${half}√2 + y)² = ${length ** 2}.`,
                `The full graph has center (${half}√2, −${half}√2) and radius ${length}. Its area is ${length ** 2}π.`,
                "The physically possible ladder positions trace an arc. The problem asks for the area enclosed by the full equation."
              ]);
            })
        ]
      }
    ];

    const levelsPerRealm = realms[0].units.length * ranks.length;
    const $ = id => document.getElementById(id);
    const app = $("app");

    let selectedRealm = 0;
    let battle = null;
    let state = load();

    function load() {
      try {
        const saved = JSON.parse(localStorage.getItem(storageKey));
        if (saved?.version === 1) return saved;
      } catch {
        $("notice").textContent = "Saved progress could not be loaded.";
      }

      return {
        version: 1,
        xp: 0,
        gold: 5,
        potions: 1,
        diagnostic: [],
        pending: null,
        cleared: realms.map(() => []),
        journal: []
      };
    }

    function save() {
      try {
        localStorage.setItem(storageKey, JSON.stringify(state));
      } catch {
        $("notice").textContent = "Browser storage is unavailable. Progress stays in this session.";
      }
      updateInventory();
    }

    function updateInventory() {
      $("inventory").textContent = `${state.xp} XP · ${state.gold} gold · ${state.potions} potions`;
    }

    function el(tag, text, className) {
      const node = document.createElement(tag);
      if (text !== undefined) node.textContent = text;
      if (className) node.className = className;
      return node;
    }

    function button(label, action, primary = false) {
      const control = el("button", label, primary ? "primary" : undefined);
      control.type = "button";
      control.addEventListener("click", action);
      return control;
    }

    function actions(...controls) {
      const row = el("div", undefined, "row");
      row.append(...controls);
      return row;
    }

    function screen(label, title) {
      const panel = el("section", undefined, "panel");
      const heading = el("h1", title);
      heading.tabIndex = -1;
      if (label) panel.append(el("p", label, "eyebrow"));
      panel.append(heading);
      app.replaceChildren(panel);
      heading.focus({ preventScroll: true });
      window.scrollTo(0, 0);
      return panel;
    }

    function explanation(title, q, className = "") {
      const card = el("div", undefined, "note");
      if (className) card.classList.add(className);
      const list = el("ol");
      q.steps.forEach(step => list.append(el("li", step)));
      card.append(el("h3", title), el("p", q.prompt), list);
      return card;
    }

    function unitAt(realm, level) {
      return realms[realm].units[Math.floor(level / ranks.length)];
    }

    function rankAt(level) {
      return level % ranks.length;
    }

    function makeQuestion(realm, level, recent = []) {
      const unit = unitAt(realm, level);
      const start = Math.floor(Math.random() * 30);
      let q;

      for (let offset = 0; offset < 30; offset += 1) {
        q = unit.create(3 + (start + offset) % 30, rankAt(level));
        if (!recent.includes(q.prompt)) return q;
      }

      return q;
    }

    function placed() {
      return state.diagnostic.length === diagnosticLength;
    }

    function answersFor(realm) {
      return state.diagnostic.filter(entry => entry.realm === realm);
    }

    function changeDifficulty(level, passed) {
      return Math.max(0, Math.min(levelsPerRealm - 1, level + (passed ? 4 : -4)));
    }

    function diagnosticLevel(realm) {
      return answersFor(realm).reduce(
        (level, entry) => changeDifficulty(level, entry.passed),
        8
      );
    }

    function recommendation(realm) {
      const entries = answersFor(realm).slice(-4);
      if (entries.length === 0) return 0;
      const candidates = entries
        .map(entry => changeDifficulty(entry.level, entry.passed))
        .sort((a, b) => a - b);
      return candidates[Math.floor((candidates.length - 1) / 2)];
    }

    function isCleared(realm, level) {
      return state.cleared[realm].includes(level);
    }

    function unlocked(realm, level) {
      return placed() && (level <= recommendation(realm) || isCleared(realm, level - 1));
    }

    function showMap() {
      updateInventory();
      document.documentElement.style.setProperty("--realm", realms[selectedRealm].color);

      const hero = el("section", undefined, "landscape");
      const intro = el("div", undefined, "hero-copy");
      intro.append(
        el("h1", "Math Quest RPG"),
        el("p", "Explore the realms, study magic powered by math, and defeat their guardians."),
        button(
          placed() ? "Placement report" : state.diagnostic.length ? "Resume placement quest" : "Start placement quest",
          placed() ? showReport : showDiagnostic,
          true
        )
      );
      hero.append(intro);

      const trail = el("nav", undefined, "map-trail");
      trail.setAttribute("aria-label", "Choose a realm");
      realms.forEach((realm, index) => {
        const control = button(realm.name, () => {
          selectedRealm = index;
          showMap();
          app.querySelectorAll(".map-trail button")[index].focus();
        });
        const icon = el("span", realm.icon, "trail-active");
        icon.setAttribute("aria-hidden", "true");
        control.prepend(icon);
        control.setAttribute("aria-pressed", String(index === selectedRealm));
        trail.append(control);
      });

      const curriculum = el("section", undefined, "panel");
      const realm = realms[selectedRealm];
      curriculum.append(
        el("h2", `${realm.name} curriculum`),
        el("p", "Open any unit to preview its explanation and worked example. You can do this before placement.")
      );

      realm.units.forEach((unit, unitIndex) => {
        const first = unitIndex * ranks.length;
        const details = el("details", undefined, "unit");
        const recommended = placed() && unitAt(selectedRealm, recommendation(selectedRealm)) === unit;
        details.open = recommended;
        details.append(
          el("summary", `${unit.title} · Levels ${first + 1}–${first + ranks.length}`),
          el("p", unit.rule),
          explanation("Worked example", unit.create(2, 0))
        );

        const grid = el("div", undefined, "grid");
        ranks.forEach((rank, offset) => {
          const level = first + offset;
          const status = isCleared(selectedRealm, level)
            ? "Cleared"
            : recommended && level === recommendation(selectedRealm)
              ? "Recommended start"
              : unlocked(selectedRealm, level)
                ? "Ready to play"
                : "Preview";
          const control = button(`Level ${level + 1} · ${rank}`, () => showLesson(selectedRealm, level));
          control.classList.add("level");
          control.append(el("small", status));
          grid.append(control);
        });

        details.append(grid);
        curriculum.append(details);
      });

      app.replaceChildren(hero, trail, curriculum);
    }

    function answerForm(onSubmit, actionLabel = "Submit answer") {
      const form = el("form", undefined, "row");
      const label = el("label", "Your answer");
      label.htmlFor = "answerInput";
      const input = el("input");
      input.id = "answerInput";
      input.type = "text";
      input.inputMode = "text";
      input.autocomplete = "off";
      input.required = true;

      const submit = el("button", actionLabel, "primary");
      submit.type = "submit";

      const error = el("p");
      error.setAttribute("role", "status");
      form.append(label, input, submit, error);

      form.addEventListener("submit", event => {
        event.preventDefault();
        const value = input.value.trim().replace(/^−/, "-");
        if (!/^[+-]?\d+$/.test(value) || !Number.isSafeInteger(Number(value))) {
          error.textContent = "Enter a whole number, such as 12 or -4.";
          return;
        }

        input.disabled = true;
        submit.disabled = true;
        onSubmit(Number(value));
      });

      return form;
    }

    function meter(value, max, label) {
      const bar = el("progress");
      bar.value = value;
      bar.max = max;
      bar.setAttribute("aria-label", label);
      return bar;
    }

    function showDiagnostic() {
      if (placed()) {
        showReport();
        return;
      }

      const index = state.diagnostic.length;
      const realm = index % realms.length;
      const level = diagnosticLevel(realm);

      if (!state.pending) {
        const recent = answersFor(realm).map(entry => entry.q.prompt);
        state.pending = makeQuestion(realm, level, recent);
        save();
      }

      const q = state.pending;
      const panel = screen(`Placement quest · ${index + 1} of ${diagnosticLength}`, realms[realm].name);
      panel.append(
        meter(index, diagnosticLength, "Placement progress"),
        el("p", q.prompt, "question")
      );

      function submit(answer) {
        if (state.diagnostic.length !== index) return;
        state.diagnostic.push({ realm, level, q, answer, passed: answer === q.answer });
        state.pending = null;
        save();
        showDiagnostic();
      }

      panel.append(answerForm(submit), button("I’m not sure", () => submit(null)));
    }

    function showReport() {
      const panel = screen("Placement complete", "Choose your starting realm");
      const grid = el("div", undefined, "grid");

      realms.forEach((realm, index) => {
        const level = recommendation(index);
        const tile = el("article", undefined, "tile");
        tile.append(
          el("h3", realm.name),
          el("p", `Level ${level + 1} · ${unitAt(index, level).title} · ${ranks[rankAt(level)]}`),
          button("Open recommended lesson", () => showLesson(index, level), true)
        );
        grid.append(tile);
      });

      panel.append(grid);
    }

    function showLesson(realm, level) {
      selectedRealm = realm;
      const unit = unitAt(realm, level);
      const panel = screen(
        `${realms[realm].name} · Level ${level + 1} · ${ranks[rankAt(level)]}`,
        unit.title
      );

      panel.append(el("p", unit.rule), explanation("Worked example", unit.create(2, rankAt(level))));

      if (unlocked(realm, level)) {
        panel.append(
          el("p", "Train with hints, then face the guardian. Solve four problems before losing all your hearts."),
          actions(
            button("Start training", () => showTraining(realm, level), true),
            button("Fight guardian", () => startBattle(realm, level))
          )
        );
      } else {
        panel.append(
          el("p", placed()
            ? "Clear the previous level to unlock this fight."
            : "Complete placement to unlock training and battles."),
          button(placed() ? "World map" : "Go to placement", placed() ? showMap : showDiagnostic)
        );
      }
    }

    function recordMistake(q, answer, source) {
      state.journal = [
        { q, answer, source },
        ...state.journal.filter(entry => entry.q.prompt !== q.prompt)
      ].slice(0, 100);
    }

    function showTraining(realm, level, recent = []) {
      const unit = unitAt(realm, level);
      const q = makeQuestion(realm, level, recent);
      const panel = screen(`${realms[realm].name} · Training`, unit.title);
      panel.append(el("p", q.prompt, "question"));

      const hint = el("details", undefined, "note");
      hint.append(el("summary", "Reveal the rule"), el("p", unit.rule));
      let usedHint = false;
      hint.addEventListener("toggle", () => {
        if (hint.open) usedHint = true;
      });

      const result = el("div");
      result.tabIndex = -1;
      panel.append(answerForm(answer => {
        const correct = answer === q.answer;

        if (correct) {
          state.xp += usedHint || hint.open ? 1 : 3;
        } else {
          recordMistake(q, answer, "Training");
        }

        save();
        result.append(
          explanation(correct ? "Correct" : `Correct answer: ${q.answer}`, q, correct ? "good" : "bad"),
          button("Next training problem", () => {
            showTraining(realm, level, [...recent, q.prompt].slice(-10));
          }, true)
        );
        result.focus();
      }), hint, result, button("Fight guardian", () => startBattle(realm, level)));
    }

    function startBattle(realm, level) {
      if (!unlocked(realm, level)) return;

      battle = {
        realm,
        level,
        hp: startingHP,
        enemyHP: checkpointLength,
        recent: [],
        q: makeQuestion(realm, level),
        feedback: null
      };
      showBattle();
    }

    function fighter(name, hp, max, monster = false) {
      const card = el("div", undefined, "fighter");
      const sprite = el("span", undefined, monster ? "sprite monster" : "sprite");
      sprite.setAttribute("aria-hidden", "true");
      card.append(sprite, el("strong", `${name} · ${hp}/${max} HP`), meter(hp, max, name));
      return card;
    }

    function showBattle() {
      const current = battle;
      const realm = realms[current.realm];
      const panel = screen(`${realm.name} · Level ${current.level + 1}`, `${realm.foe.trim()} battle`);
      const arena = el("div", undefined, "arena");
      arena.append(
        fighter("You", current.hp, startingHP),
        fighter(realm.foe.trim(), current.enemyHP, checkpointLength, true)
      );
      panel.append(arena);

      if (current.feedback) {
        const { correct, reward } = current.feedback;
        const title = correct ? "Your spell hits!" : `The guardian hits back. Answer: ${current.q.answer}`;
        panel.append(explanation(title, current.q, correct ? "good" : "bad"));

        if (!current.enemyHP) {
          panel.append(el("h2", "Guardian defeated"), el("p", reward));
          if (current.level + 1 < levelsPerRealm) {
            panel.append(button("Open next lesson", () => showLesson(current.realm, current.level + 1), true));
          } else {
            panel.append(el("p", `You cleared the final level of ${realm.name}.`));
          }
          panel.append(button("World map", showMap));
          return;
        }

        if (!current.hp) {
          panel.append(
            el("h2", "Return to camp"),
            actions(
              button("Review the lesson", () => showLesson(current.realm, current.level), true),
              button("Try the fight again", () => startBattle(current.realm, current.level))
            )
          );
          return;
        }

        panel.append(button("Next turn", () => {
          current.recent.push(current.q.prompt);
          current.q = makeQuestion(current.realm, current.level, current.recent);
          current.feedback = null;
          showBattle();
        }, true));
        return;
      }

      panel.append(el("p", current.q.prompt, "question"), answerForm(answer => {
        if (battle !== current || current.feedback) return;
        const correct = answer === current.q.answer;
        let reward = "";

        if (correct) {
          current.enemyHP -= 1;

          if (current.enemyHP === 0 && !isCleared(current.realm, current.level)) {
            state.cleared[current.realm].push(current.level);
            state.xp += 20;
            state.gold += 8;
            reward = "First clear reward: 20 XP and 8 gold.";
          } else if (current.enemyHP === 0) {
            reward = "Replay complete.";
          }
        } else {
          current.hp -= 1;
          recordMistake(current.q, answer, "Battle");
        }

        current.feedback = { correct, reward };
        save();
        showBattle();
      }, "Cast spell"));

      const potion = button(`Heal +1 HP (${state.potions} potions)`, () => {
        if (state.potions === 0 || current.hp === startingHP) return;
        state.potions -= 1;
        current.hp += 1;
        save();
        showBattle();
      });
      potion.disabled = state.potions === 0 || current.hp === startingHP;
      panel.append(potion);
    }

    function showShop() {
      const panel = screen("Camp", "Potion shop");
      const price = 5;
      const buy = button(`Buy healing potion · ${price} gold`, () => {
        if (state.gold < price) return;
        state.gold -= price;
        state.potions += 1;
        save();
        showShop();
      }, true);

      buy.disabled = state.gold < price;
      panel.append(el("p", "A potion restores one heart during a guardian fight. Earn gold by clearing a level for the first time."), buy);
      if (state.gold < price) panel.append(el("p", "You need 5 gold to buy a potion."));
      if (battle && battle.hp > 0 && battle.enemyHP > 0) {
        panel.append(button("Return to battle", showBattle));
      }
    }

    function showJournal() {
      const panel = screen("Camp", "Quest journal");
      const diagnosticMisses = placed()
        ? state.diagnostic.filter(entry => !entry.passed)
          .map(entry => ({ q: entry.q, answer: entry.answer, source: "Placement" }))
        : [];
      const entries = [...state.journal, ...diagnosticMisses];

      if (!entries.length) panel.append(el("p", "Missed problems appear here with their full solutions. Placement solutions unlock after the quest."));

      entries.forEach(({ q, answer, source }) => {
        const detail = el("details", undefined, "unit");
        detail.append(
          el("summary", `${source} · ${q.prompt}`),
          el("p", `Your answer: ${answer ?? "Skipped"}. Correct answer: ${q.answer}.`),
          explanation("How to solve it", q)
        );
        panel.append(detail);
      });

      if (battle && battle.hp > 0 && battle.enemyHP > 0) {
        panel.append(button("Return to battle", showBattle));
      }
    }

    $("mapButton").addEventListener("click", showMap);
    $("shopButton").addEventListener("click", showShop);
    $("journalButton").addEventListener("click", showJournal);
    showMap();
  </script>
</body>
</html>
