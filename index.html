<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Math Quest RPG</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #fff8eb;
      --muted: #c9d5e3;
      --gold: #ffdc91;
      --mint: #a6f6ce;
      --line: #536180;
      --danger: #ffafba;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(ellipse at 80% 0%, #384369, #101827 65%);
      color: var(--ink);
      font: 1rem/1.55 system-ui, sans-serif;
    }

    header, main { width: min(960px, calc(100% - 24px)); margin: auto; }
    header, nav, .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    header { justify-content: space-between; padding: 13px 0; }
    main { padding-bottom: 36px; }
    h1, h2, h3, p { margin: 0 0 .6em; }
    h1 { font-size: clamp(1.8rem, 6vw, 3rem); line-height: 1.05; }
    p, li, small { color: var(--muted); }
    strong { color: var(--gold); }
    .label { color: var(--mint); font-size: .8rem; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; }
    .panel, .note, .tile {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: clamp(12px, 3vw, 24px);
      background: #1a263c;
    }

    .note, .tile { padding: 13px; background: #253550; }
    .note { margin: 12px 0; }
    .note ol { margin: 0; padding-left: 23px; }
    .note li + li { margin-top: 5px; }
    .good { color: var(--mint); }
    .bad { color: var(--danger); }
    button, input {
      min-height: 44px;
      padding: 8px 13px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #2d3e5f;
      color: var(--ink);
      font: inherit;
    }

    button { cursor: pointer; font-weight: 700; }
    button:hover:not(:disabled) { border-color: var(--mint); }
    button:disabled { opacity: .55; cursor: default; }
    .primary { background: var(--mint); color: #102821; border-color: transparent; }
    :focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 155px), 1fr)); gap: 8px; }
    .level { display: grid; text-align: left; }
    details { border-top: 1px solid var(--line); padding: 10px 0; }
    summary { cursor: pointer; font-weight: 750; }
    form { margin: 10px 0; }
    form label, form p { width: 100%; }
    form input { flex: 1 1 105px; min-width: 0; }
    progress { display: block; width: 100%; height: 11px; accent-color: var(--mint); }
    .hud div:last-child progress { accent-color: var(--danger); }
    #notice:empty, form p:empty, .feedback:empty { display: none; }

    .board {
      display: grid;
      grid-template-columns: repeat(var(--columns), minmax(0, 1fr));
      overflow: hidden;
      border: 3px solid #839f97;
      border-radius: 14px;
      background: #384f46;
      box-shadow: 0 8px 22px #0008;
    }

    .cell {
      display: grid;
      place-items: center;
      aspect-ratio: 1;
      min-width: 0;
      font-size: clamp(10px, 4vw, 28px);
      line-height: 1;
      background: radial-gradient(ellipse at 25% 70%, #e1e69658 0 10%, transparent 11%), #527952;
    }

    .cell:nth-child(odd) { background-color: #5b8456; }
    .cell.wall { background: linear-gradient(145deg, #849394, #415358 65%); box-shadow: inset 0 -4px #293e46; }
    .cell.tree { background: radial-gradient(ellipse, #243f35, #3d6650); }
    .cell.water { background: repeating-linear-gradient(165deg, #226385 0 8px, #3d91ae 9px 12px); }
    .cell.path { background: radial-gradient(circle at 30% 37%, #fbe1ac55 0 7%, transparent 8%), #af8d63; }
    .cell.gate { background: radial-gradient(circle, #ffe698, #997445); box-shadow: inset 0 0 0 2px #ffe6ad96; }
    .cell.near { outline: 2px solid var(--gold); outline-offset: -2px; }
    .cell.hero { outline: 2px solid var(--mint); outline-offset: -3px; }
    .pawn {
      display: grid;
      place-items: center;
      width: 87%;
      height: 87%;
      border: 2px solid #e1ccff;
      border-radius: 50%;
      background: #543c78;
      box-shadow: 0 0 11px #e2b2ff9c;
    }

    .arena {
      max-width: 480px;
      margin: 10px auto;
      padding: 5px;
      gap: 4px;
      border-color: #9b86bb;
      background: linear-gradient(145deg, #573e6a, #1d2949);
    }

    .arena .cell { aspect-ratio: 1.45; border: 1px solid #626987; border-radius: 6px; background: #303b5b; }
    .arena .cell:nth-child(odd) { background: #384465; }
    .arena .cell.enemy { background: radial-gradient(circle, #a16e92, #3b2b51); }
    .arena .cell.danger {
      background: repeating-linear-gradient(135deg, #a43d59 0 7px, #702944 8px 14px);
      border-color: #ffd1d3;
      color: white;
    }

    .arena .cell.strike { background: #ffba80; color: #331733; }
    .hud { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .controls { margin: 9px 0; }
    .dpad { display: grid; grid-template-columns: repeat(3, 44px); gap: 4px; }
    .dpad button { padding: 0; }
    .dpad button:first-child { grid-column: 2; }
    .dpad button:nth-child(2) { grid-column: 1; }
    .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--muted); }
    .question { color: var(--ink); font-size: clamp(1.1rem, 3vw, 1.45rem); }
    .feedback { margin-top: 12px; }
  </style>
</head>
<body>
  <header>
    <strong>✦ Math Quest RPG</strong>
    <nav aria-label="Game navigation">
      <button type="button" id="village">Village</button>
      <button type="button" id="journal">Journal</button>
    </nav>
    <span id="inventory"></span>
  </header>

  <main>
    <p id="notice" role="status"></p>
    <div id="app"></div>
  </main>

  <script>
    "use strict";

    const $ = id => document.getElementById(id);
    const app = $("app");
    const ranks = ["Apprentice", "Scout", "Knight", "Master"];
    const storageKey = "moonridge-dodge-rpg-v1";
    const placementLength = 30;
    const heroMax = 3;
    const guardianMax = 4;
    const arenaWidth = 7;
    const arenaHeight = 5;
    const guardianTile = { x: 5, y: 2 };
    const quietTime = 3000;
    const warningTime = 1000;
    const flashTime = 220;

    function problem(prompt, answer, ...steps) {
      return { prompt, answer, steps };
    }

    function gcd(a, b) {
      while (b) [a, b] = [b, a % b];
      return a;
    }

    function factorial(n) {
      let result = 1;
      for (let i = 2; i <= n; i++) result *= i;
      return result;
    }

    function choose(n, k) {
      return Math.round(factorial(n) / (factorial(k) * factorial(n - k)));
    }

    const realms = [
      {
        name: "Number Forge", icon: "⚒️", guardian: "Ember Golem", sprite: "🗿",
        units: [
          ["Place Value and Subtraction", "Subtract place-value chunks separately.", (n, r) => {
            const a = 57 + n + 100 * r, b = 18 + n % 9 + 46 * r;
            const chunk = b - b % 10;
            return problem(`Find ${a} − ${b}.`, a - b,
              `Split ${b} into ${chunk} + ${b % 10}.`,
              `Subtract ${chunk} first to get ${a - chunk}.`,
              `Subtract the remaining ${b % 10} to get ${a - b}.`);
          }],
          ["Distributive Multiplication", "Split a factor into tens and ones, then multiply both parts.", (n, r) => {
            const a = 13 + n + 12 * r, b = 3 + r + n % 5;
            const tens = a - a % 10, ones = a % 10;
            return problem(`Find ${a} × ${b}.`, a * b,
              `Write ${a} as ${tens} + ${ones}.`,
              `Multiply the two parts by ${b}: ${tens * b} and ${ones * b}.`,
              `Add the partial products to get ${a * b}.`);
          }],
          ["Greatest Common Factor", "When dividing two numbers, their common factors also divide the remainder.", (n, r) => {
            let a = (n + 3) * (5 + r), b = (n + 3) * (3 + r);
            const prompt = `Find the greatest common factor of ${a} and ${b}.`;
            const steps = [];
            while (b) {
              steps.push(`${a} = ${Math.floor(a / b)} × ${b} + ${a % b}.`);
              [a, b] = [b, a % b];
            }
            return problem(prompt, a, ...steps, `The last nonzero divisor is ${a}.`);
          }],
          ["Least Common Multiple", "For two positive integers, GCF × LCM equals their product.", (n, r) => {
            const a = n + 6, b = n + 10 + 2 * r, d = gcd(a, b);
            return problem(`Find the least common multiple of ${a} and ${b}.`, a * b / d,
              `Their greatest common factor is ${d}.`,
              `Divide the product by their GCF: ${a} × ${b} ÷ ${d} = ${a * b / d}.`);
          }],
          ["Fractions of a Whole", "The denominator gives the number of equal parts in the whole.", (n, r) => {
            const top = 2 + r, bottom = 5 + r, part = n + 4;
            return problem(`What is ${top}/${bottom} of ${part * bottom}?`, part * top,
              `Divide ${part * bottom} by ${bottom} to get one part, ${part}.`,
              `Take ${top} parts: ${part} × ${top} = ${part * top}.`);
          }],
          ["Adding Fractions", "Use a common denominator so both fractions count pieces of the same size.", (n, r) => {
            const b = 5 + r, a = 1 + n % (b - 1);
            return problem(`Write ${a}/${b} + 1/${2 * b} with denominator ${2 * b}. What is the numerator?`, 2 * a + 1,
              `Multiply the first numerator and denominator by 2 to get ${2 * a}/${2 * b}.`,
              `Keep the denominator and add the numerators: ${2 * a} + 1 = ${2 * a + 1}.`);
          }],
          ["Unit Rates", "Find the cost of one item before scaling up.", (n, r) => {
            const count = 4 + r, cost = n + 2, wanted = 7 + 2 * r;
            return problem(`${count} notebooks cost $${count * cost}. What do ${wanted} cost at the same rate, in dollars?`, wanted * cost,
              `One notebook costs ${count * cost} ÷ ${count} = $${cost}.`,
              `Multiply ${wanted} × ${cost} to get $${wanted * cost}.`);
          }],
          ["Percent of a Number", "Percent means per hundred. Convert it to a fraction over 100.", (n, r) => {
            const percent = [15, 35, 65, 125][r], whole = 20 * (n + 3);
            const answer = whole * percent / 100;
            return problem(`What is ${percent}% of ${whole}?`, answer,
              `${percent}% is ${percent}/100.`,
              `Multiply ${whole} × ${percent}/100 = ${answer}.`);
          }],
          ["Reverse Percent Changes", "The sale price equals the original price times the fraction you paid.", (n, r) => {
            const discount = [10, 25, 35, 45][r], original = 20 * (n + 5);
            const paid = 100 - discount, sale = original * paid / 100;
            return problem(`After a ${discount}% discount, a price is $${sale}. Find the original price in dollars.`, original,
              `Subtract the discount from 100%. You paid ${paid}% of the original.`,
              `Divide ${sale} by ${paid / 100} to get ${original}.`);
          }],
          ["Linear Equations", "Keep an equation balanced by applying each operation to both sides.", (n, r) => {
            const x = n - 9, a = 3 + r, b = 4 + 2 * r;
            return problem(`Solve for x: ${a}x + ${b} = ${a * x + b}.`, x,
              `Subtract ${b} from both sides: ${a}x = ${a * x}.`,
              `Divide both sides by ${a} to get x = ${x}.`,
              `Check by substitution: ${a} × (${x}) + ${b} = ${a * x + b}.`);
          }]
        ]
      },
      {
        name: "Counting Forest", icon: "🌲", guardian: "Moss Mimic", sprite: "🍄",
        units: [
          ["Multiplication Principle", "Multiply the numbers of choices when each first choice can pair with every second choice.", (n, r) => {
            const a = 3 + r + n % 8, b = 2 + n % 7;
            return problem(`Choose one of ${a} hats and one of ${b} capes. How many outfits can you make?`, a * b,
              `Each of the ${a} hats has ${b} possible cape partners.`,
              `Multiply ${a} × ${b} = ${a * b}.`);
          }],
          ["Codes With Repetition", "With repeats allowed, every position has the same number of choices.", (n, r) => {
            const symbols = 3 + n % 9, slots = 2 + r;
            return problem(`A code has ${slots} positions, each with ${symbols} choices. Repeats are allowed. How many codes exist?`, symbols ** slots,
              `Every position has ${symbols} options, even after you use a symbol.`,
              `Multiply those counts: ${symbols}^${slots} = ${symbols ** slots}.`);
          }],
          ["Codes Without Repetition", "Each used symbol removes one choice from the next position.", (n, r) => {
            const slots = 2 + r, symbols = slots + 2 + n % 9;
            const counts = Array.from({ length: slots }, (_, i) => symbols - i);
            const answer = counts.reduce((total, count) => total * count, 1);
            return problem(`A ${slots}-position code uses ${symbols} distinct symbols. No symbol repeats. How many codes exist?`, answer,
              `You start with ${symbols} choices. Each later position has one fewer.`,
              `${counts.join(" × ")} = ${answer}.`);
          }],
          ["Distinct Roles", "Swapping people in different roles creates a different assignment.", (n, r) => {
            const students = n + 5 + r;
            return problem(`Choose a captain and deputy from ${students} students. The roles go to different people. How many assignments are possible?`, students * (students - 1),
              `Choose the captain in ${students} ways.`,
              `There are ${students - 1} choices left for deputy.`,
              `Multiply to get ${students * (students - 1)}.`);
          }],
          ["Unordered Teams", "Count ordered picks, then divide by how many orders represent the same team.", (n, r) => {
            const k = 2 + r, students = k + 4 + n % 10;
            const counts = Array.from({ length: k }, (_, i) => students - i);
            return problem(`How many ${k}-person teams can you choose from ${students} students?`, choose(students, k),
              `Count ordered selections with ${counts.join(" × ")}.`,
              `Every team appears in ${k}! = ${factorial(k)} orders.`,
              `Divide the ordered count by ${factorial(k)} to get ${choose(students, k)}.`);
          }],
          ["Arrangements and Blocks", "Treat objects that must stay together as one block.", (n, r) => {
            const books = 5 + r + n % 5, group = 2 + r % 2;
            const objects = books - group + 1;
            const answer = factorial(objects) * factorial(group);
            return problem(`Arrange ${books} different books. A specified group of ${group} books must stay together. How many arrangements are possible?`, answer,
              `Replace the group with one block. Now there are ${objects} objects to arrange.`,
              `Arrange the objects in ${objects}! ways and the inside of the block in ${group}! ways.`,
              `Multiply to get ${answer}.`);
          }],
          ["Counting the Complement", "For an “at least one” problem, count all outcomes and subtract the ones with none.", (n, r) => {
            const slots = 3 + r, symbols = 3 + n % 7;
            const all = symbols ** slots, none = (symbols - 1) ** slots;
            return problem(`A ${slots}-digit code uses digits 1 through ${symbols}, with repetition allowed. How many codes contain at least one 1?`, all - none,
              `There are ${symbols}^${slots} = ${all} total codes.`,
              `Omitting 1 leaves ${symbols - 1} choices per slot, giving ${none} codes with none.`,
              `Subtract ${all} − ${none} = ${all - none}.`);
          }],
          ["Exactly k Heads", "Choose where the heads go. The remaining positions are tails.", (n, r) => {
            const flips = 5 + r + n % 8, heads = 1 + r;
            const answer = choose(flips, heads);
            return problem(`Flip a coin ${flips} times. How many ordered sequences have exactly ${heads} ${heads === 1 ? "head" : "heads"}?`, answer,
              `Choose ${heads} of the ${flips} positions for heads.`,
              `Each choice gives one sequence because the other positions are tails.`,
              `The number of choices is ${flips}! ÷ (${heads}! × ${flips - heads}!) = ${answer}.`);
          }],
          ["Probability With Dice", "With a fair die, every ordered sequence of results is equally likely.", (n, r) => {
            const rolls = 2 + r + n % 5, all = 6 ** rolls, none = 5 ** rolls;
            return problem(`Roll a fair die ${rolls} times. The probability of at least one six is k/${all}. Find k.`, all - none,
              `There are 6^${rolls} = ${all} equally likely ordered results.`,
              `There are 5^${rolls} = ${none} results with no six.`,
              `Subtract to get ${all - none} favorable results.`);
          }],
          ["Pigeonhole Principle", "Count how many draws can avoid the target. One additional draw forces it.", (n, r) => {
            const colors = 3 + n % 11, target = 2 + r, safe = colors * (target - 1);
            return problem(`A bag has socks in ${colors} colors and at least ${target} of each color. How many socks must you draw blindly, without replacement, to guarantee ${target} of one color?`, safe + 1,
              `You could draw ${target - 1} socks of every color without meeting the target.`,
              `That accounts for ${colors} × ${target - 1} = ${safe} socks.`,
              `One more forces some color to reach ${target}. The answer is ${safe + 1}.`);
          }]
        ]
      },
      {
        name: "Geometry Citadel", icon: "🏰", guardian: "Prism Drake", sprite: "🐉",
        units: [
          ["Rectangle Perimeter", "Perimeter is the distance around all four sides.", (n, r) => {
            const a = 8 + n + 3 * r, b = 3 + r + n % 5;
            return problem(`Find the perimeter of a ${a} by ${b} rectangle.`, 2 * (a + b),
              `Add one length and one width: ${a} + ${b} = ${a + b}.`,
              `Double that sum to count all four sides: ${2 * (a + b)} units.`);
          }],
          ["Area and Missing Sides", "Rectangle area is length times width.", (n, r) => {
            const a = 7 + n, b = 3 + r + n % 4;
            return problem(`A rectangle has area ${a * b} and width ${b}. Find its length.`, a,
              `Write ${a * b} = length × ${b}.`,
              `Divide by ${b} to get a length of ${a}.`);
          }],
          ["Triangle Area", "A triangle covers half the area of a parallelogram with the same base and perpendicular height.", (n, r) => {
            const b = n + 8, h = 2 * (3 + r + n % 4);
            return problem(`A triangle has base ${b} and perpendicular height ${h}. Find its area.`, b * h / 2,
              `Multiply base by height: ${b} × ${h} = ${b * h}.`,
              `Take half to get ${b * h / 2} square units.`);
          }],
          ["Trapezoid Area", "Multiply the average of the parallel sides by the perpendicular height.", (n, r) => {
            const a = 4 + n, b = a + 3 + r, h = 4 + 2 * r;
            return problem(`A trapezoid has parallel sides ${a} and ${b} and height ${h}. Find its area.`, (a + b) * h / 2,
              `Average the parallel sides: (${a} + ${b}) ÷ 2 = ${(a + b) / 2}.`,
              `Multiply by ${h} to get ${(a + b) * h / 2} square units.`);
          }],
          ["Polygon Angles", "Diagonals from one vertex of a convex polygon split it into triangles.", (n, r) => {
            const sides = 5 + r + n % 12;
            return problem(`Find the interior angle sum of a convex ${sides}-sided polygon, in degrees.`, (sides - 2) * 180,
              `The diagonals form ${sides} − 2 = ${sides - 2} triangles.`,
              `Each contributes 180°, so the total is ${(sides - 2) * 180}°.`);
          }],
          ["Pythagorean Theorem", "The squares of a right triangle’s legs add to the square of its hypotenuse.", (n, r) => {
            const scale = 2 + n % 13;
            const [a, b, c] = [[3, 4, 5], [5, 12, 13], [8, 15, 17], [7, 24, 25]][r]
              .map(side => side * scale);
            return problem(`A right triangle has hypotenuse ${c} and one leg ${a}. Find the other leg.`, b,
              `Write ${a}² + x² = ${c}².`,
              `Subtract ${a}² to get x² = ${c * c - a * a}.`,
              `Take the positive square root because x is a length: x = ${b}.`);
          }],
          ["Similar Figures", "Multiplying every length by a scale factor multiplies area by the square of that factor.", (n, r) => {
            const scale = 2 + r, area = 12 + n;
            return problem(`A triangle of area ${area} is enlarged so each side is ${scale} times as long. Find its new area.`, area * scale ** 2,
              `Both the base and the height grow by ${scale}.`,
              `Area grows by ${scale} × ${scale} = ${scale ** 2}.`,
              `Multiply ${area} × ${scale ** 2} = ${area * scale ** 2}.`);
          }],
          ["Coordinate Distance", "Use horizontal and vertical changes as the legs of a right triangle.", (n, r) => {
            const x = n - 11, y = r - 5, scale = r + 1 + n % 4;
            const a = 3 * scale, b = 4 * scale;
            return problem(`Find the distance from (${x}, ${y}) to (${x + a}, ${y + b}).`, 5 * scale,
              `The horizontal difference is ${a} and the vertical difference is ${b}.`,
              `Use √(${a}² + ${b}²) = √${a * a + b * b} = ${5 * scale}.`);
          }],
          ["Circle Equations", "Every point on (x − h)² + (y − k)² = r² is r units from the center (h, k).", (n, r) => {
            const h = n + 1, k = r + 2, radius = 3 + r + n % 9;
            return problem(`The circle (x − ${h})² + (y + ${k})² = ${radius ** 2} encloses an area of aπ. Find a.`, radius ** 2,
              `The center is (${h}, −${k}). Those coordinates make both parentheses zero.`,
              `The right side is the squared radius, so the radius is ${radius}.`,
              `Area = πr² = ${radius ** 2}π. The coefficient a is ${radius ** 2}.`);
          }],
          ["The Sliding Ladder", "The fixed ladder length links its changing height and distance from the wall.", (n, r) => {
            const half = 3 + r + n % 11, length = 2 * half;
            return problem(`A ${length}-ft ladder starts at 45°. Its base moves x feet toward the wall and its top rises y feet. The full graph of their equation encloses aπ square feet. Find a.`, length ** 2,
              `At 45°, both starting legs are ${length}/√2 = ${half}√2 feet.`,
              `After the move, they are ${half}√2 − x and ${half}√2 + y.`,
              `Their squares add to ${length ** 2}, the fixed ladder length squared.`,
              `The full graph is a circle with center (${half}√2, −${half}√2) and radius ${length}.`,
              `Its area is ${length ** 2}π. The physical ladder positions trace only an arc.`);
          }]
        ]
      }
    ];

    const levelsPerRealm = realms[0].units.length * ranks.length;
    const villageMap = [
      "###############",
      "#TTN...=..C..T#",
      "#T.=T..=..=...#",
      "#..=T..=..=...#",
      "#F===========S#",
      "#...www=..=...#",
      "#...www=.T=...#",
      "#..T...====P..#",
      "###############"
    ];

    const gates = {
      N: [realms[0].name, realms[0].icon, () => showRealm(0)],
      F: [realms[1].name, realms[1].icon, () => showRealm(1)],
      C: [realms[2].name, realms[2].icon, () => showRealm(2)],
      S: ["Potion Shop", "🧪", showShop],
      P: ["Placement Hall", "🧭", showPlacement]
    };

    const terrain = {
      "#": ["wall", ""],
      T: ["tree", "🌲"],
      w: ["water", ""],
      "=": ["path", ""],
      ".": ["grass", ""]
    };

    const directions = [
      ["↑", "up", 0, -1, "arrowup", "w"],
      ["←", "left", -1, 0, "arrowleft", "a"],
      ["↓", "down", 0, 1, "arrowdown", "s"],
      ["→", "right", 1, 0, "arrowright", "d"]
    ];

    let state = load();
    let villageView = null;
    let arenaView = null;
    let battle = null;
    let attackTimer = null;

    function walkable(x, y) {
      const tile = villageMap[y]?.[x];
      return Boolean(tile && !["#", "T", "w"].includes(tile));
    }

    function load() {
      const fresh = {
        xp: 0, gold: 5, potions: 1, position: { x: 7, y: 7 },
        diagnostic: [], pending: null, cleared: realms.map(() => []), mistakes: []
      };

      try {
        const saved = JSON.parse(localStorage.getItem(storageKey));
        if (saved && Array.isArray(saved.diagnostic) &&
            Array.isArray(saved.mistakes) && Array.isArray(saved.cleared) &&
            saved.cleared.length === realms.length && saved.cleared.every(Array.isArray)) {
          const loaded = { ...fresh, ...saved };
          if (!walkable(loaded.position?.x, loaded.position?.y)) loaded.position = fresh.position;
          return loaded;
        }
      } catch {
        $("notice").textContent = "Saved progress could not be loaded.";
      }

      return fresh;
    }

    function inventory() {
      $("inventory").textContent = `${state.xp} XP · ${state.gold} gold · ${state.potions} potions`;
    }

    function save() {
      try {
        localStorage.setItem(storageKey, JSON.stringify(state));
      } catch {
        $("notice").textContent = "Browser storage is unavailable. Progress lasts for this visit.";
      }
      inventory();
    }

    function el(tag, text, className) {
      const node = document.createElement(tag);
      if (text !== undefined) node.textContent = text;
      if (className) node.className = className;
      return node;
    }

    function button(text, action, primary = false) {
      const control = el("button", text, primary ? "primary" : undefined);
      control.type = "button";
      control.addEventListener("click", action);
      return control;
    }

    function row(...children) {
      const node = el("div", undefined, "row");
      node.append(...children);
      return node;
    }

    function stopAttacks() {
      clearTimeout(attackTimer);
      attackTimer = null;
    }

    function screen(label, title) {
      stopAttacks();
      villageView = null;
      arenaView = null;

      const panel = el("section", undefined, "panel");
      const heading = el("h1", title);
      heading.tabIndex = -1;
      panel.append(el("p", label, "label"), heading);
      app.replaceChildren(panel);
      heading.focus({ preventScroll: true });
      window.scrollTo(0, 0);
      return panel;
    }

    function explanation(title, q) {
      const box = el("section", undefined, "note");
      const steps = el("ol");
      for (const step of q.steps) steps.append(el("li", step));
      box.append(el("h3", title), el("p", q.prompt), steps);
      return box;
    }

    function meter(value, max, label) {
      const bar = el("progress");
      bar.max = max;
      bar.value = value;
      bar.setAttribute("aria-label", label);
      return bar;
    }

    function answerForm(grade, label = "Submit answer") {
      const form = el("form", undefined, "row");
      const input = el("input");
      const caption = el("label", "Your answer");
      const submit = el("button", label, "primary");
      const error = el("p", undefined, "bad");

      input.id = "math-answer";
      input.type = "text";
      input.autocomplete = "off";
      input.required = true;
      caption.htmlFor = input.id;
      submit.type = "submit";
      error.setAttribute("role", "status");
      form.append(caption, input, submit, error);

      form.addEventListener("submit", event => {
        event.preventDefault();
        if (submit.disabled) return;
        const raw = input.value.trim().replace(/^−/, "-");
        const answer = Number(raw);

        if (!/^[+-]?\d+$/.test(raw) || !Number.isSafeInteger(answer)) {
          error.textContent = "Enter a whole number, such as 12 or -4.";
          return;
        }

        input.disabled = true;
        submit.disabled = true;
        error.textContent = "";
        grade(answer);
      });

      return { form, input };
    }

    function sameTile(first, second) {
      return first.x === second.x && first.y === second.y;
    }

    function board(width, height, className = "") {
      const node = el("div", undefined, `board ${className}`);
      node.style.setProperty("--columns", width);
      node.setAttribute("aria-hidden", "true");

      const cells = Array.from({ length: height }, () =>
        Array.from({ length: width }, () => {
          const cell = el("div", undefined, "cell");
          node.append(cell);
          return cell;
        })
      );

      return { node, cells };
    }

    function dpad(move, verb) {
      const pad = el("div", undefined, "dpad");
      for (const [arrow, name, dx, dy] of directions) {
        const control = button(arrow, () => move(dx, dy));
        control.setAttribute("aria-label", `${verb} ${name}`);
        pad.append(control);
      }
      return pad;
    }

    function nearbyGate() {
      const { x, y } = state.position;
      for (const [dx, dy] of [[0, 0], [0, -1], [-1, 0], [0, 1], [1, 0]]) {
        const gate = gates[villageMap[y + dy]?.[x + dx]];
        if (gate) return { gate, x: x + dx, y: y + dy };
      }
      return null;
    }

    function refreshVillage() {
      const view = villageView;
      const { x, y } = state.position;
      view.hero?.classList.remove("hero");
      view.hero = view.cells[y][x];
      view.hero.classList.add("hero");
      view.hero.append(view.player);

      const nearby = nearbyGate();
      view.highlight?.classList.remove("near");
      view.highlight = nearby ? view.cells[nearby.y][nearby.x] : null;
      view.highlight?.classList.add("near");
      view.enter.disabled = !nearby;
      view.enter.textContent = nearby ? `Enter ${nearby.gate[0]}` : "Enter location";

      const text = nearby ? `${nearby.gate[0]} is within reach.` : "Follow a path to a golden gate.";
      if (view.status.textContent !== text) view.status.textContent = text;
    }

    function moveVillage(dx, dy) {
      if (!villageView) return;
      const x = state.position.x + dx, y = state.position.y + dy;
      if (!walkable(x, y)) return;
      state.position = { x, y };
      refreshVillage();
    }

    function enterGate() {
      const nearby = nearbyGate();
      if (!villageView || !nearby) return;
      save();
      nearby.gate[2]();
    }

    function resumeButton(panel) {
      if (resumable()) panel.append(button("Resume guardian fight", showBattle));
    }

    function showVillage() {
      const panel = screen("Overworld", "Moonridge Village");
      panel.append(el("p", "Move with WASD, the arrow keys, or the buttons. Press E beside a gate to enter."));
      const map = board(villageMap[0].length, villageMap.length);

      villageMap.forEach((line, y) => {
        [...line].forEach((symbol, x) => {
          const gate = gates[symbol];
          const [style, icon] = gate ? ["gate", gate[1]] : terrain[symbol];
          const cell = map.cells[y][x];
          cell.classList.add(style);
          cell.textContent = icon;
        });
      });

      const status = el("p");
      status.setAttribute("role", "status");
      const enter = button("Enter location", enterGate, true);
      const legend = el("div", undefined, "legend");

      for (const [name, icon] of Object.values(gates)) {
        legend.append(el("span", `${icon} ${name}`));
      }

      const controls = row(dpad(moveVillage, "Move"), status, enter);
      controls.classList.add("controls");
      panel.append(map.node, controls, legend);
      resumeButton(panel);
      villageView = { cells: map.cells, player: el("span", "🧙", "pawn"), status, enter };
      refreshVillage();
    }

    function lessonAt(realm, level) {
      return realms[realm].units[Math.floor(level / ranks.length)];
    }

    function rankAt(level) {
      return level % ranks.length;
    }

    function newQuestion(realm, level, recent = []) {
      const make = lessonAt(realm, level)[2];
      const start = Math.floor(Math.random() * 40);
      let candidate;

      for (let offset = 0; offset < 40; offset++) {
        candidate = make(3 + (start + offset) % 40, rankAt(level));
        if (!recent.includes(candidate.prompt)) return candidate;
      }

      return candidate;
    }

    function complete() {
      return state.diagnostic.length >= placementLength;
    }

    function realmAnswers(realm) {
      return state.diagnostic.filter(entry => entry.realm === realm);
    }

    function adjust(level, correct) {
      return Math.max(0, Math.min(levelsPerRealm - 1, level + (correct ? 4 : -4)));
    }

    function recommended(realm) {
      const estimates = realmAnswers(realm).slice(-4)
        .map(entry => adjust(entry.level, entry.correct))
        .sort((a, b) => a - b);
      return estimates[Math.floor((estimates.length - 1) / 2)] ?? 0;
    }

    function cleared(realm, level) {
      return state.cleared[realm].includes(level);
    }

    function unlocked(realm, level) {
      return complete() &&
        (level <= recommended(realm) || cleared(realm, level - 1) || cleared(realm, level));
    }

    function showPlacement() {
      if (complete()) {
        showReport();
        return;
      }

      const index = state.diagnostic.length;
      const realm = index % realms.length;
      const history = realmAnswers(realm);
      const level = history.reduce((estimate, entry) => adjust(estimate, entry.correct), 8);

      if (!state.pending) {
        state.pending = newQuestion(realm, level, history.map(entry => entry.q.prompt));
        save();
      }

      const q = state.pending;
      const panel = screen(`Placement · ${index + 1} of ${placementLength}`, realms[realm].name);

      function submit(answer) {
        if (state.diagnostic.length !== index) return;
        state.diagnostic.push({ realm, level, q, answer, correct: answer === q.answer });
        state.pending = null;
        save();
        showPlacement();
      }

      const label = index === placementLength - 1 ? "See results" : "Next question";
      panel.append(
        meter(index, placementLength, "Placement progress"),
        el("p", q.prompt, "question"),
        answerForm(submit, label).form,
        button("I’m not sure", () => submit(null))
      );
    }

    function showReport() {
      const panel = screen("Placement complete", "Your starting levels");
      const grid = el("div", undefined, "grid");

      realms.forEach((region, realm) => {
        const level = recommended(realm);
        const score = realmAnswers(realm).filter(entry => entry.correct).length;
        const tile = el("article", undefined, "tile");
        tile.append(
          el("h2", region.name),
          el("p", `${score}/10 correct · Start at Level ${level + 1}`),
          el("p", lessonAt(realm, level)[0]),
          button("Open lesson", () => showLesson(realm, level), true)
        );
        grid.append(tile);
      });

      panel.append(grid, button("Back to village", showVillage));
    }

    function showRealm(realm) {
      const region = realms[realm];
      const panel = screen("Curriculum", region.name);
      panel.append(el("p", "Open any unit to read its explanation and worked example before placement."));

      region.units.forEach(([title, rule, make], index) => {
        const first = index * ranks.length;
        const detail = el("details");
        detail.open = complete() && Math.floor(recommended(realm) / ranks.length) === index;
        detail.append(
          el("summary", `${title} · Levels ${first + 1}–${first + ranks.length}`),
          el("p", rule),
          explanation("Worked example", make(0, 0))
        );

        const grid = el("div", undefined, "grid");
        ranks.forEach((rank, offset) => {
          const level = first + offset;
          const control = button(`Level ${level + 1} · ${rank}`, () => showLesson(realm, level));
          control.classList.add("level");
          const status = cleared(realm, level) ? "Cleared" :
            complete() && level === recommended(realm) ? "Recommended start" :
            unlocked(realm, level) ? "Ready to play" : "Preview lesson";
          control.append(el("small", status));
          grid.append(control);
        });

        detail.append(grid);
        panel.append(detail);
      });

      panel.append(button("Back to village", showVillage));
    }

    function showLesson(realm, level) {
      const [title, rule, make] = lessonAt(realm, level);
      const panel = screen(`${realms[realm].name} · Level ${level + 1} · ${ranks[rankAt(level)]}`, title);
      panel.append(el("p", rule), explanation("Worked example", make(0, rankAt(level))));

      if (unlocked(realm, level)) {
        panel.append(
          el("p", "Train with hints or enter the arena. Keep moving and land four correct spells to win."),
          row(
            button("Start training", () => showTraining(realm, level), true),
            button("Fight guardian", () => startBattle(realm, level))
          )
        );
      } else {
        panel.append(el("p", complete()
          ? "Clear the previous level to unlock training and combat."
          : "Visit the Placement Hall to unlock your starting levels."));
      }

      panel.append(button("Realm curriculum", () => showRealm(realm)));
    }

    function rememberMistake(q, answer, source) {
      state.mistakes = [
        { q, answer, source },
        ...state.mistakes.filter(entry => entry.q.prompt !== q.prompt)
      ].slice(0, 100);
    }

    function showTraining(realm, level, recent = []) {
      const [title, rule] = lessonAt(realm, level);
      const q = newQuestion(realm, level, recent);
      const panel = screen(`${realms[realm].name} · Training`, title);
      const hint = el("details", undefined, "note");
      hint.append(el("summary", "Reveal a hint"), el("p", rule));

      let usedHint = false;
      hint.addEventListener("toggle", () => { if (hint.open) usedHint = true; });
      const feedback = el("div", undefined, "feedback");

      const answer = answerForm(value => {
        const correct = value === q.answer;
        if (correct) state.xp += usedHint || hint.open ? 1 : 3;
        else rememberMistake(q, value, "Training");
        save();

        feedback.append(
          explanation(correct ? "Correct!" : `Correct answer: ${q.answer}`, q),
          button("Next problem", () => showTraining(realm, level, [...recent, q.prompt].slice(-10)), true)
        );
      });

      panel.append(
        el("p", q.prompt, "question"), answer.form, hint, feedback,
        button("Fight guardian", () => startBattle(realm, level))
      );
    }

    /* Real-time guardian battles */

    function resumable() {
      return Boolean(battle && battle.hp > 0 && battle.enemyHP > 0);
    }

    function startBattle(realm, level) {
      if (!unlocked(realm, level)) return;
      battle = {
        realm, level, hp: heroMax, enemyHP: guardianMax,
        player: { x: 1, y: 2 },
        q: newQuestion(realm, level), recent: [],
        marked: [], flashing: false, lastSpell: null
      };
      showBattle();
    }

    function randomAttackTiles() {
      const options = [];
      for (let y = 0; y < arenaHeight; y++) {
        for (let x = 0; x < arenaWidth; x++) {
          const tile = { x, y };
          if (!sameTile(tile, guardianTile)) options.push(tile);
        }
      }

      const chosen = [];
      for (let i = 0; i < 3; i++) {
        const index = Math.floor(Math.random() * options.length);
        chosen.push(options.splice(index, 1)[0]);
      }
      return chosen;
    }

    function marked(current, tile) {
      return current.marked.some(target => sameTile(target, tile));
    }

    function activeFight(current) {
      return current === battle && resumable() && arenaView?.current === current && !document.hidden;
    }

    function scheduleAttack(current, delay, action) {
      stopAttacks();
      if (!activeFight(current)) return;
      attackTimer = setTimeout(() => {
        attackTimer = null;
        if (activeFight(current)) action();
      }, delay);
    }

    function beginAttackCycle(current) {
      current.marked = [];
      current.flashing = false;
      paintArena(current);

      scheduleAttack(current, quietTime, () => {
        current.marked = randomAttackTiles();
        paintArena(current);
        arenaView.status.textContent = "Three squares are marked. Move out before they strike!";
        scheduleAttack(current, warningTime, () => strike(current));
      });
    }

    function strike(current) {
      const hit = marked(current, current.player);
      if (hit) current.hp--;
      current.flashing = true;

      if (current.hp === 0) {
        showBattleResult(current, false);
        return;
      }

      paintArena(current);
      arenaView.status.textContent = hit
        ? `The attack hit you. ${current.hp} hearts left.`
        : "You avoided the attack!";

      scheduleAttack(current, flashTime, () => {
        current.marked = [];
        current.flashing = false;
        paintArena(current);
        scheduleAttack(current, quietTime - flashTime, () => warnAgain(current));
      });
    }

    function warnAgain(current) {
      current.marked = randomAttackTiles();
      paintArena(current);
      arenaView.status.textContent = "Three squares are marked. Move out before they strike!";
      scheduleAttack(current, warningTime, () => strike(current));
    }

    function moveArena(dx, dy) {
      if (!activeFight(battle)) return;

      const current = battle;
      const next = { x: current.player.x + dx, y: current.player.y + dy };
      if (next.x < 0 || next.x >= arenaWidth || next.y < 0 || next.y >= arenaHeight ||
          sameTile(next, guardianTile)) return;

      current.player = next;
      paintArena(current);
    }

    function paintArena(current) {
      const view = arenaView;
      if (view?.current !== current) return;

      const region = realms[current.realm];
      view.cells.forEach((line, y) => {
        line.forEach((cell, x) => {
          const tile = { x, y };
          const hero = sameTile(tile, current.player);
          const enemy = sameTile(tile, guardianTile);
          const danger = marked(current, tile);
          cell.classList.toggle("hero", hero);
          cell.classList.toggle("enemy", enemy);
          cell.classList.toggle("danger", danger);
          cell.classList.toggle("strike", danger && current.flashing);
          cell.replaceChildren();
          if (hero) cell.append(view.player);
          else if (enemy) cell.textContent = region.sprite;
          else if (danger) cell.textContent = current.flashing ? "✹" : "!";
        });
      });

      view.heroLabel.textContent = `You · ${current.hp}/${heroMax} HP`;
      view.enemyLabel.textContent = `${region.guardian} · ${current.enemyHP}/${guardianMax} HP`;
      view.heroBar.value = current.hp;
      view.enemyBar.value = current.enemyHP;
      view.heal.disabled = state.potions < 1 || current.hp >= heroMax;
      view.heal.textContent = `Heal 1 HP · ${state.potions} potions`;

      const safe = marked(current, current.player) ? "Marked tile" : "Safe tile";
      const position = `Row ${current.player.y + 1}, column ${current.player.x + 1} · ${safe}`;
      if (view.position.textContent !== position) view.position.textContent = position;
    }

    function renderBattleQuestion(current, focusAnswer = false) {
      const view = arenaView;
      const q = current.q;
      const answer = answerForm(value => castSpell(current, q, value), "Cast spell");
      view.question.replaceChildren(el("p", q.prompt, "question"), answer.form);
      if (focusAnswer) answer.input.focus({ preventScroll: true });
    }

    function castSpell(current, q, answer) {
      if (!activeFight(current) || current.q !== q) return;
      const correct = answer === q.answer;
      if (correct) current.enemyHP--;
      else rememberMistake(q, answer, "Guardian battle");

      current.lastSpell = { q, correct };
      if (current.enemyHP === 0) {
        showBattleResult(current, true);
        return;
      }

      save();
      const result = explanation(correct ? "Your spell hits!" : `Spell missed. Correct answer: ${q.answer}`, q);
      arenaView.feedback.replaceChildren(result);
      paintArena(current);

      current.recent = [...current.recent, q.prompt].slice(-10);
      current.q = newQuestion(current.realm, current.level, current.recent);
      renderBattleQuestion(current, true);
    }

    function showBattle() {
      if (!resumable()) return;
      const current = battle;
      const region = realms[current.realm];
      const panel = screen(`${region.name} · Level ${current.level + 1}`, `${region.guardian} battle`);

      const heroLabel = el("strong");
      const enemyLabel = el("strong");
      const heroBar = meter(current.hp, heroMax, "Your health");
      const enemyBar = meter(current.enemyHP, guardianMax, "Guardian health");
      const hero = el("div");
      const enemy = el("div");
      hero.append(heroLabel, heroBar);
      enemy.append(enemyLabel, enemyBar);

      const hud = el("div", undefined, "hud");
      hud.append(hero, enemy);
      const map = board(arenaWidth, arenaHeight, "arena");

      const status = el("p", "Move freely. Red squares warn you where the attack will land.");
      status.setAttribute("role", "status");
      const position = el("p");
      const question = el("div");
      const feedback = el("div", undefined, "feedback");
      feedback.setAttribute("aria-live", "polite");

      const heal = button("", () => {
        if (!activeFight(current) || state.potions < 1 || current.hp >= heroMax) return;
        state.potions--;
        current.hp++;
        save();
        paintArena(current);
      });

      const controls = row(dpad(moveArena, "Move"), heal);
      controls.classList.add("controls");
      panel.append(hud, map.node, status, position, controls, question, feedback);
      arenaView = {
        current, cells: map.cells, player: el("span", "🧙", "pawn"),
        heroLabel, enemyLabel, heroBar, enemyBar, heal, status, position, question, feedback
      };

      if (current.lastSpell) {
        const { q, correct } = current.lastSpell;
        feedback.append(explanation(correct ? "Last spell hit" : `Last answer: ${q.answer}`, q));
      }

      renderBattleQuestion(current);
      beginAttackCycle(current);
    }

    function showBattleResult(current, won) {
      let reward = "";
      if (won) {
        if (cleared(current.realm, current.level)) {
          reward = "Replay complete.";
        } else {
          state.cleared[current.realm].push(current.level);
          state.xp += 20;
          state.gold += 8;
          reward = "First victory earned 20 XP and 8 gold.";
        }
      }

      save();
      const panel = screen("Battle results", won ? "Guardian defeated!" : "Return to camp");
      if (won) {
        panel.append(el("p", reward, "good"), explanation("Winning spell", current.lastSpell.q));
        if (current.level + 1 < levelsPerRealm) {
          panel.append(button("Open next level", () => showLesson(current.realm, current.level + 1), true));
        } else {
          panel.append(el("p", `You cleared the final level of ${realms[current.realm].name}.`));
        }
      } else {
        panel.append(
          el("p", "You ran out of hearts. Move off the marked tiles before they strike."),
          row(
            button("Try again", () => startBattle(current.realm, current.level), true),
            button("Review lesson", () => showLesson(current.realm, current.level))
          )
        );
      }

      panel.append(button("Back to village", showVillage));
    }

    function showShop() {
      const panel = screen("Moonridge Village", "Potion Shop");
      const buy = button("Buy a healing potion · 5 gold", () => {
        if (state.gold < 5) return;
        state.gold -= 5;
        state.potions++;
        save();
        showShop();
      }, true);
      buy.disabled = state.gold < 5;

      panel.append(
        el("p", "A potion restores one heart. First-time victories earn gold."),
        row(buy, button("Back to village", showVillage))
      );
      resumeButton(panel);
    }

    function showJournal() {
      const panel = screen("Review", "Quest Journal");
      const diagnosticMisses = complete()
        ? state.diagnostic.filter(entry => !entry.correct).map(entry => ({ ...entry, source: "Placement" }))
        : [];
      const entries = [...state.mistakes, ...diagnosticMisses];

      if (!entries.length) {
        panel.append(el("p", "Missed problems and their solutions appear here. Placement solutions unlock after the test."));
      }

      for (const { q, answer, source } of entries) {
        const detail = el("details");
        detail.append(
          el("summary", `${source} · ${q.prompt}`),
          el("p", `Your answer: ${answer ?? "Skipped"}. Correct answer: ${q.answer}.`),
          explanation("Step-by-step solution", q)
        );
        panel.append(detail);
      }
      resumeButton(panel);
    }

    document.addEventListener("keydown", event => {
      if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey || event.isComposing) return;
      const key = event.key.toLowerCase();
      const direction = directions.find(item => item[4] === key || item[5] === key);

      // The battle input only accepts whole numbers. Movement keys can also
      // control the wizard while that input has focus.
      if (direction && (villageView || arenaView)) {
        event.preventDefault();
        const dx = direction[2], dy = direction[3];
        if (villageView) moveVillage(dx, dy);
        else moveArena(dx, dy);
      } else if (villageView && key === "e" && !event.repeat) {
        event.preventDefault();
        enterGate();
      }
    });

    document.addEventListener("visibilitychange", () => {
      stopAttacks();
      if (document.hidden || !arenaView || !resumable()) return;
      arenaView.status.textContent = "Battle resumed. Watch for red squares.";
      beginAttackCycle(battle);
    });

    window.addEventListener("pagehide", () => {
      stopAttacks();
      save();
    });

    window.addEventListener("pageshow", event => {
      if (event.persisted && arenaView && resumable()) beginAttackCycle(battle);
    });

    $("village").addEventListener("click", showVillage);
    $("journal").addEventListener("click", showJournal);
    inventory();
    showVillage();
  </script>
</body>
</html>
